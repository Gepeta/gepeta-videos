{

const weeds = [];
{

  for (let i = 0; i < 16; i++) {

      b.position.copy(m.position).add(V((rnd() - 0.5), (rnd()) * 0.6, (rnd() - 0.5))); b.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3); river.add(b);

  // raízes que descem da margem

    const z = (rnd() - 0.5) * 24, x = 9 + rnd() * 4; m.position.set(x, S - L / 2 + 0.3, z); m.rotation.set((rnd() - 0.5) * 0.5, 0, (rnd() - 0.5) * 0.5);

    m.position.set(x, bedH(x, z) + s * 0.3, z); m.scale.y = 0.5 + rnd() * 0.4; m.rotation.set(rnd(), rnd() * 3, rnd()); m.castShadow = m.receiveShadow = true; river.add(m);

const rayTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const x = c.getContext('2d');

// ---------------------------------------------------------------- piranha
function makePiranha(o = {}) {
  const back = new THREE.Color(o.back ?? 0x8a9590), belly = new THREE.Color(o.belly ?? 0xd8402a), spark = new THREE.Color(o.spark ?? 0xc7d0cc);
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  let g = new THREE.IcosahedronGeometry(1, 2).toNonIndexed();
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    // corpo alto e achatado, cabeça rombuda, afina pro rabo
    const sx = x < 0 ? 0.66 : 0.52; x *= sx;
    y *= 0.5 * (x < 0 ? 1 + x * 0.55 : 1 - x * 0.25);
    z *= 0.17 * (x < 0 ? 1 + x * 0.8 : 1);
    if (x > 0.3 && y < 0) y *= 1.15; // queixo pesado
    p.setXYZ(i, x, y, z);
  }
  const cols = [];
  for (let i = 0; i < p.count; i += 3) {
    const cy = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3, cx = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3;
    let c = cy < -0.08 ? belly : back;
    if (cy > -0.08 && cy < 0.2 && hash(i * 0.37 + cx * 9) > 0.62) c = spark;
    if (cx > 0.36 && cy > -0.08) c = back.clone().multiplyScalar(0.82);
    for (let k = 0; k < 3; k++) cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); g.computeVertexNormals();
  const bodyMat = mat(0xffffff, { vertexColors: true, roughness: 0.45, metalness: 0.15 });
  const bm = new THREE.Mesh(g, bodyMat); body.add(bm);

  // mandíbula de baixo (prognata) com dentes triangulares
  const toothM = mat(0xf7f3e6, { roughness: 0.3 });
  const jaw = new THREE.Group(); jaw.position.set(0.42, -0.12, 0); body.add(jaw);
  const jg = new THREE.BoxGeometry(0.2, 0.08, 0.2); jg.translate(0.06, -0.03, 0);
  const jawMesh = new THREE.Mesh(jg, mat(belly.clone().multiplyScalar(0.8).getHex())); jaw.add(jawMesh);
  const tooth = (x, y, z, down) => { const c = new THREE.ConeGeometry(0.026, 0.07, 3); if (down) c.rotateX(Math.PI); c.translate(x, y, z); return c; };
  const lt = [], ut = [];
  for (let k = 0; k < 4; k++) { for (const s of [-1, 1]) { lt.push(tooth(0.01 + k * 0.045, 0.035, s * (0.075 - k * 0.012), false)); ut.push(tooth(0.44 + k * 0.04, -0.06, s * (0.07 - k * 0.012), true)); } }
  jaw.add(new THREE.Mesh(mergeGeometries(lt), toothM));
  body.add(new THREE.Mesh(mergeGeometries(ut), toothM));
  // olhos
  const eyeM = mat(o.eye ?? 0xd9a520, { roughness: 0.2 }), pupM = mat(0x0b0b0b, { roughness: 0.1 });
  const eyes = [];
  for (const s of [-1, 1]) {
    const e = new THREE.Group(); e.position.set(0.33, 0.08, s * 0.1); body.add(e);
    e.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 1), eyeM));
    const pu = new THREE.Mesh(new THREE.IcosahedronGeometry(0.036, 1), pupM); pu.position.set(0.012, 0, s * 0.035); e.add(pu);
    eyes.push({ e, pu, s });
  }
  // opérculo (guelra) que abre e fecha
  const gills = [];
  for (const s of [-1, 1]) {
    const gp = new THREE.Group(); gp.position.set(0.22, -0.02, s * 0.13); body.add(gp);
    const gm = new THREE.Mesh(new THREE.CircleGeometry(0.16, 6, -1.2, 2.4), mat(back.clone().multiplyScalar(0.75).getHex(), { side: THREE.DoubleSide }));
    gm.rotation.y = s > 0 ? 0 : Math.PI; gm.scale.set(0.5, 1, 1); gp.add(gm); gills.push({ gp, s });
  }
  // nadadeiras
  const finM = mat(o.fin ?? 0x5d6662, { side: THREE.DoubleSide, transparent: true, opacity: 0.92 });
  const tri = (pts) => { const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); gg.computeVertexNormals(); return gg; };
  const tail = new THREE.Group(); tail.position.set(-0.6, 0, 0); body.add(tail);
  tail.add(new THREE.Mesh(tri([0, 0, 0, -0.42, 0.36, 0, -0.3, 0.02, 0, 0, 0, 0, -0.3, -0.02, 0, -0.42, -0.36, 0]), finM));
  const tb = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.6, 0.012), mat(0x2a2a2a)); tb.position.x = -0.36; tail.add(tb);
  body.add(new THREE.Mesh(tri([-0.05, 0.42, 0, -0.42, 0.25, 0, -0.18, 0.62, 0]), finM));
  body.add(new THREE.Mesh(tri([-0.12, -0.38, 0, -0.5, -0.18, 0, -0.32, -0.52, 0]), finM));
  const pecs = [];
  for (const s of [-1, 1]) {
    const pg = new THREE.Group(); pg.position.set(0.15, -0.16, s * 0.12); body.add(pg);
    pg.add(new THREE.Mesh(tri([0, 0, 0, -0.2, -0.04, s * 0.1, -0.16, -0.12, s * 0.06]), finM)); pecs.push(pg);
  }
  // bexiga natatória (só no latido)
  const blM = new THREE.MeshStandardMaterial({ color: 0xffd36b, emissive: 0xffaa22, emissiveIntensity: 1.4, flatShading: true, transparent: true, opacity: 0.9, depthTest: false });
  const bladder = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 1), blM); bladder.scale.set(1.3, 0.75, 0.5); bladder.position.set(-0.08, 0.05, 0); bladder.renderOrder = 30; bladder.visible = false; body.add(bladder);

  const st = { t: 0, ph: rnd() * 6, speed: 1, jaw: 0, gill: 0, look: 0, scared: 0, bladder: 0, dim: 0 };
  root.userData.st = st;
  const allMats = [bodyMat, finM, eyeM, toothM, jawMesh.material];
  function tick() {
    const t = st.t + st.ph;
    const sw = Math.sin(t * 6 * st.speed);
    tail.rotation.y = sw * 0.45 * Math.min(1.4, st.speed);
    body.rotation.y = -sw * 0.06;
    pecs.forEach((pg, i) => pg.rotation.y = Math.sin(t * 5 + i) * 0.4);
    jaw.rotation.z = -st.jaw * 0.6;
    const gf = st.gill > 0 ? Math.sin(t * (4 + st.gill * 14)) : Math.sin(t * 2.2);
    gills.forEach(g => g.gp.rotation.y = g.s * (0.12 + 0.35 * (0.5 + 0.5 * gf) * (0.3 + st.gill)));
    eyes.forEach(e => { e.pu.position.x = 0.012 + 0.02 * st.look; e.pu.position.y = 0.012 * Math.sin(st.t * 7 + e.s) * st.scared; e.pu.scale.setScalar(1 - 0.45 * st.scared); });
    if (st.scared > 0) { body.position.set((hash(Math.floor(st.t * 40) + st.ph * 100) - 0.5) * 0.03 * st.scared, (hash(Math.floor(st.t * 40) + 7 + st.ph) - 0.5) * 0.03 * st.scared, 0); } else body.position.set(0, 0, 0);
    bladder.visible = st.bladder > 0.01; bladder.scale.set(1.3 * st.bladder, 0.75 * st.bladder, 0.5 * st.bladder);
    allMats.forEach(m => { m.transparent = st.dim > 0.01 || m === finM; m.opacity = m === finM ? 0.92 * (1 - st.dim * 0.8) : 1 - st.dim * 0.8; });
  }
  return { root, st, tick };
}
// aponta o peixe (que olha pra +x) numa direção
const aim = (f, pos, dir) => { f.root.position.copy(pos); const yaw = Math.atan2(-dir.z, dir.x); const pitch = Math.asin(clamp(dir.y / (dir.length() || 1), -0.8, 0.8)); f.root.rotation.set(0, yaw, pitch, 'YZX'); };

// cardume
const NS = 46;
const school = []; const schoolGrp = new THREE.Group(); scene.add(schoolGrp);
for (let i = 0; i < NS; i++) {
  const f = makePiranha({ back: [0x8a9590, 0x7f8c86, 0x95a09a][i % 3], belly: [0xd8402a, 0xc8381f, 0xe04f2e][i % 3] });
  const sc = 0.75 + hash(i + 3) * 0.4; f.root.scale.setScalar(sc);
  const u = hash(i * 1.7), v = hash(i * 2.9 + 1), r = Math.cbrt(hash(i * 4.1 + 2));
  school.push({ f, a0: u * 6.283, yo: (v - 0.5) * 2, rr: 0.35 + r * 0.65, sc, core: r < 0.5 });
  schoolGrp.add(f.root);
}
function schoolAt(t, o) {
  const c = o.c ?? V(0, 3.5, 0), R = o.R ?? 2.5, spin = o.spin ?? 0.35, H = o.H ?? 0.7;
  for (let i = 0; i < NS; i++) {
    const s = school[i]; const f = s.f; f.root.visible = i < (o.n ?? NS);
    const dirSign = 1; const w = spin * (1.2 - s.rr * 0.4);
    const a = s.a0 + t * w * dirSign;
    const r = R * s.rr * (o.tight ?? 1);
    let pos = V(c.x + Math.cos(a) * r, c.y + s.yo * H + 0.12 * Math.sin(t * 1.3 + i), c.z + Math.sin(a) * r);
    let dir = V(-Math.sin(a), 0.05 * Math.cos(t + i), Math.cos(a)).multiplyScalar(-1);
    if (spin < 0) dir.multiplyScalar(-1);
    if (o.flee) { // foge de um ponto
      const d = pos.clone().sub(o.flee.p); const dl = d.length(); const k = o.flee.k * clamp(1.8 - dl / 5, 0, 1.5);
      pos.add(d.normalize().multiplyScalar(k * 2.2)); if (k > 0.2) dir = d.clone().setY(0).normalize();
    }
    if (o.face) { const d = o.face.clone().sub(pos).normalize(); dir.lerp(d, o.faceK ?? 1).normalize(); }
    if (o.swim) { pos.add(o.swim.clone()); }
    aim(f, pos, dir);
    f.st.t = t; f.st.speed = o.speed ?? 1; f.st.jaw = o.jaw ? Math.max(0, Math.sin(t * 9 + i * 1.3)) * o.jaw : 0;
    f.st.scared = o.scared ?? 0; f.st.gill = o.gill ?? 0; f.st.look = 0; f.st.bladder = 0; f.st.dim = 0;
    if (s.core && o.coreBig) f.root.scale.setScalar(s.sc * 1.25); else f.root.scale.setScalar(s.sc);
    f.tick();
  }
}

{

    hero.root.visible = true; hero.st.t = t; hero.st.scared = 1; hero.st.gill = 0.6;
    const back = sm(T.cagao - 0.05, T.cagao + 0.25, t);
    aim(hero, V(0.1 - back * 0.5, 3.6, 1.5 - back * 0.4), V(1, 0, 0.9)); hero.tick();
    if (t > T.cagao - 0.05 && t < T.cagao + 0.3) shake = 0.03;
    look(V(1.9, 3.85, 5.4 - 0.4 * k), V(0, 3.6, 1.2), 42);
  }
  else if (N === 'mordida') {
    setWater(new THREE.Color(0x2c3a24), 0.06);
    black.root.visible = true; black.st.t = t; black.st.speed = 0.8;
    let j = 0; for (const bt of T.bites) j = Math.max(j, clamp(1 - Math.abs(t - bt - 0.05) / 0.22, 0, 1));
    black.st.jaw = j;
    aim(black, V(0, 3.6, 0), V(1, 0.05, 0.7)); black.tick();
    for (const bt of T.bites) if (t > bt + 0.03 && t < bt + 0.2) shake = 0.03;
    const a = lerp(1.35, 0.95, k);
    look(V(Math.sin(a) * 4.6 + 0.4, 3.85 + 0.2 * k, Math.cos(a) * 4.6), V(0.4, 3.55, 0.2), 42);
  }
  else if (N === 'latido') {
    setWater(new THREE.Color(0x34492b), 0.065);
    hero.root.visible = true; hero2.root.visible = true; hero.st.t = t; hero2.st.t = t;
    hero.st.bladder = sm(sh.start + 0.3, sh.start + 1.0, t) * (1 + 0.15 * Math.sin(t * 20));
    const barks = [T.late, T.bark2, T.bark2 + 0.8].filter(x => x > 0);
    let rec = 0; barks.forEach((b, i) => {
      const age = t - b; const r = rings[i];
      if (age > 0 && age < 1.2) { r.visible = true; r.position.set(-0.1, 3.65, 0.4); r.lookAt(camera.position); r.scale.setScalar(0.4 + age * 2.4); r.material.opacity = 0.8 * (1 - age / 1.2); }
      rec = Math.max(rec, sm(b, b + 0.4, t));
      if (age > 0 && age < 0.15) hero.st.bladder *= 1.35;
    });
    aim(hero, V(-0.3, 3.6, 0.3), V(1, 0, 0.3)); hero.st.jaw = 0.15; hero.tick();
    aim(hero2, V(1.7 + rec * 0.8, 3.65, -0.3 - rec * 0.3), rec > 0.3 ? V(1, 0, -0.3) : V(-1, 0, 0.1)); hero2.st.speed = 1 + rec; hero2.tick();
    look(V(0.7, 3.95, 5.6), V(0.6, 3.6, 0), 44);
    overlay.barks = barks;
  }
  else if (N === 'saida') {
    me.visible = true; mode = 'walk'; schoolGrp.visible = true;
    const x = lerp(0, 6.8, k);
    me.position.set(x, S - 0.15 + Math.max(0, x - 6) * 0.62 * 0.3, 0); me.rotation.set(0, Math.PI / 2, 0);
    schoolAt(t, { c: V(-2.5, 3.0, -1.5), R: 3.2, spin: 0.2, speed: 0.7, n: 34 });
    look(V(x - 1.2, 3.6, 5.8), V(x + 0.6, 4.8, 0), 50);
  }
  else { // outro
    schoolGrp.visible = true;
    schoolAt(t, { c: V(0, 3.4, -3), R: 2.6, spin: 0.25, speed: 0.8, n: 36 });
    hero.root.visible = true; hero.st.t = t; hero.st.speed = 0.6;
    hero.st.jaw = 0.25 + 0.25 * Math.sin(t * 2.2); hero.st.look = sm(sh.end - 2.4, sh.end - 1.6, t);
    aim(hero, V(0, 3.7, 1.2), V(0.15, 0.02 + 0.06 * Math.sin(t * 1.5), 1)); hero.root.rotation.x = 0.15 * Math.sin(t * 1.1); hero.tick();
    look(V(0.2, 3.9, lerp(4.4, 6.0, k)), V(0, 3.65, 1.0), 42);
  }

  if (me.visible) pose(t, mode);
  if (shake > 0) { camera.position.x += (hash(t * 97) - 0.5) * shake * 6; camera.position.y += (hash(t * 131 + 3) - 0.5) * shake * 6; }
  if (u < 0.16) { camera.fov *= 1 - 0.07 * (1 - u / 0.16); camera.updateProjectionMatrix(); }

  // ambiente
  rays.forEach((r, i) => { r.m.visible = surface.visible; r.m.material.opacity = 0.15 + 0.07 * Math.sin(t * 0.6 + i); r.m.rotation.z = 0.3 + 0.1 * Math.sin(t * 0.25 + i); r.m.position.y = surface.position.y - 5.5; });
  dust.rotation.y = t * 0.015;
  weeds.forEach((w) => w.segs.forEach((sg, j) => { sg.rotation.z = 0.1 * Math.sin(t * 0.8 + w.ph + j * 0.5); }));
  const dm = new THREE.Object3D(); let bi = 0;
  const top = surface.position.y;
  // rajadas primeiro
  for (const b of bursts) {
    const age = t - b.t0; if (age < 0 || age > 2.2) continue;
    const cnt = Math.floor((b.small ? 6 : 90) * b.k * 2);
    for (let i = 0; i < cnt && bi < NB; i++, bi++) {
      const d = bubbleData[bi];
      const y = Math.min(top - 0.05, b.pos.y + age * (0.8 + d.sp * 1.4) - (b.small ? 0 : 0.8 * Math.exp(-age * 4)));
      dm.position.set(b.pos.x + d.dx * b.spread * (0.4 + age), y, b.pos.z + d.dz * b.spread * (0.4 + age));
      dm.scale.setScalar(d.s * (b.small ? 0.7 : 1.6) * (1 - age / 2.4)); dm.updateMatrix(); bubbles.setMatrixAt(bi, dm.matrix);
    }
  }
  for (; bi < NB; bi++) {
    const b = bubbleData[bi]; if (bi > 120) { dm.scale.setScalar(0); dm.updateMatrix(); bubbles.setMatrixAt(bi, dm.matrix); continue; }
    const y = ((b.ph + t * 0.1 * b.sp) % 1) * top;
    dm.position.set(Math.cos(b.a) * (2 + b.r * 9), y, Math.sin(b.a) * (2 + b.r * 9));
    dm.scale.setScalar(b.s * 0.7); dm.updateMatrix(); bubbles.setMatrixAt(bi, dm.matrix);
  }
  bubbles.instanceMatrix.needsUpdate = true;
  sun.target.updateMatrixWorld();
}

// ---------------------------------------------------------------- 2D por cima
const out = document.getElementById('out'); const ctx = out.getContext('2d');
await document.fonts.load('100px Pop');
const KEY = /^(piranhas?|errada|espirra|mordida|lento|margem|pé|mão|raríssima|25|duas|três|seca|fome|medo|jacaré|boto|biguá|estressada|juntas|cagão|30|peso|forte|late|latido|calma|devagar|doido|contrário)$/i;
const words = phrases.flatMap(p => p.words.map(w => ({ s: w[0], e: w[1], w: w[2] })));
function caption(t) {
  let cur = null; for (const w of words) { if (w.s <= t) cur = w; else break; }
  if (!cur || t > TL.total - 0.6) return;
  const raw = cur.w.replace(/[.,?!:]+$/, ''); const txt = raw.charAt(0).toUpperCase() + raw.slice(1);
  const key = KEY.test(raw.replace(/[.,?!:]/g, ''));
  const pop = 1 + 0.28 * (1 - sm(0, 0.12, t - cur.s));
  ctx.save(); ctx.translate(W / 2, 1340); ctx.scale(pop, pop); ctx.rotate(key ? -0.04 : 0);
  let fs = key ? 120 : 98; ctx.font = `${fs}px Pop`;
  const tw = ctx.measureText(txt).width; if (tw > W - 120) { fs *= (W - 120) / tw; ctx.font = `${fs}px Pop`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.lineWidth = 18; ctx.strokeStyle = '#111'; ctx.strokeText(txt, 0, 0);
  ctx.shadowColor = 'transparent'; ctx.fillStyle = key ? '#ffd43b' : '#ffffff'; ctx.fillText(txt, 0, 0);
  ctx.restore();
}
const back = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function pill(lines, y, t0, t, o = {}) {
  const a = clamp((t - t0) / 0.35, 0, 1); if (a <= 0) return;
  const s = back(a);
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s); ctx.rotate(o.rot ?? -0.02);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const sizes = lines.map(l => l.size); let h = sizes.reduce((x, y) => x + y * 1.12, 0) + 60;
  let w = 0; lines.forEach(l => { ctx.font = `${l.size}px Pop`; w = Math.max(w, ctx.measureText(l.txt).width); }); w += 90;
  ctx.fillStyle = o.bg ?? '#111'; ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 36); ctx.fill(); ctx.shadowColor = 'transparent';
  let yy = -h / 2 + 30;
  lines.forEach(l => { ctx.font = `${l.size}px Pop`; ctx.fillStyle = l.c ?? '#fff'; ctx.fillText(l.txt, 0, yy + l.size * 0.56); yy += l.size * 1.12; });
  ctx.restore();
}
function mark(ok, t0, t) {
  const a = clamp((t - t0) / 0.3, 0, 1); if (a <= 0) return; const s = back(a);
  ctx.save(); ctx.translate(W - 190, 330); ctx.scale(s, s);
  ctx.fillStyle = ok ? '#2fb344' : '#e03131'; ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(0, 0, 105, 0, 6.283); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  if (ok) { ctx.moveTo(-48, 2); ctx.lineTo(-12, 40); ctx.lineTo(52, -38); } else { ctx.moveTo(-42, -42); ctx.lineTo(42, 42); ctx.moveTo(42, -42); ctx.lineTo(-42, 42); }
  ctx.stroke(); ctx.restore();
}
function au(t0, t, x, y) {
  const age = t - t0; if (age < 0 || age > 1.0) return;
  const s = back(clamp(age / 0.2, 0, 1)) * (1 - sm(0.75, 1.0, age) * 0.3);
  ctx.save(); ctx.globalAlpha = 1 - sm(0.7, 1.0, age); ctx.translate(x, y - age * 60); ctx.scale(s, s); ctx.rotate(-0.12);
  ctx.font = '150px Pop'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 22; ctx.strokeStyle = '#111'; ctx.strokeText('AU!', 0, 0); ctx.fillStyle = '#ffd43b'; ctx.fillText('AU!', 0, 0);
  ctx.restore();
}
function overlays(t) {
  const o = overlay;
  if (o.name === 'queda' && t > 0.35) pill([{ txt: 'VOCÊ CAIU NUM RIO', size: 62 }, { txt: 'CHEIO DE PIRANHAS', size: 74, c: '#ff6b4a' }, { txt: 'O que você faz?', size: 56, c: '#ffd43b' }], 360, 0.35, t);
  if (o.name === 'erro') mark(false, SH.erro.start + 0.15, t);
  if (o.name === 'calma') mark(true, SH.calma.start + 0.15, t);
  if (o.name === 'especies') { pill([{ txt: '25 espécies', size: 92 }], 300, SH.especies.start + 0.2, t);
    if (t > T.duas) pill([{ txt: 'só 2 ou 3', size: 80, c: '#ff6b4a' }, { txt: 'perigosas pra gente', size: 50 }], 520, T.duas, t, { rot: 0.02 }); }
  if (o.name === 'mordida' && T.bites.length) pill([{ txt: '30x', size: 170, c: '#ff4d3d' }, { txt: 'o próprio peso', size: 58 }], 360, T.bites[0], t);
  if (o.name === 'latido' && o.barks) o.barks.forEach((b, i) => au(b, t, 360 + i * 160, 620 - i * 40));
  if (o.name === 'outro') pill([{ txt: 'Você ficaria', size: 56 }, { txt: 'CALMO ou EM PÂNICO?', size: 70, c: '#ffd43b' }], 360, SH.outro.start + 0.3, t);
}

window.renderAt = (t) => {
  staging(t);
  renderer.render(scene, camera);
  ctx.drawImage(renderer.domElement, 0, 0);
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.78); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,16,4,0.5)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.35 * flash})`; ctx.fillRect(0, 0, W, H); }
  overlays(t);
  caption(t);
  return out.toDataURL('image/jpeg', 0.92);
};
window.TOTAL = TL.total;
window.SHOTS = shots.map(s => [s.name, s.start, s.end]);
document.title = 'ready';
