<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Pop; src: url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf'); }
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
const W = 1080, H = 1920;
const TL = await (await fetch('./timeline.json')).json();
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
await document.fonts.load('100px Pop');

// ================================================================ utilidades
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const back = (x) => { const c = 1.7; x = clamp(x, 0, 1) - 1; return 1 + (c + 1) * x * x * x + c * x * x; };
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const hash = (i) => { const x = Math.sin(i * 127.1) * 43758.5453; return x - Math.floor(x); };

const hex = (c) => { c = c.replace('#', ''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); };
const rgb = (a) => `rgb(${a.map(v => Math.round(clamp(v, 0, 255))).join(',')})`;
const toHex = (a) => '#' + a.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (c1, c2, t) => { const a = hex(c1), b = hex(c2); return toHex(a.map((v, i) => lerp(v, b[i], t))); };
const dk = (c, t = 0.35) => mix(c, '#23163d', t);
const lt = (c, t = 0.3) => mix(c, '#fff7e8', t);
const rgba = (c, a) => { const v = hex(c); return `rgba(${v[0]},${v[1]},${v[2]},${a})`; };

const P = { skin: '#f7cfae', hair: '#5b3a29', shirt: '#3d7be0', teal: '#46f2df', red: '#ff4a5c', yellow: '#ffd45a', white: '#fffaf2', ink: '#2a1d3d' };

function shape(fn, fill, o = {}) {
  ctx.beginPath(); fn();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (o.line !== false) {
    ctx.lineWidth = o.lw || 6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = o.stroke || (typeof fill === 'string' && fill.startsWith('#') ? dk(fill, 0.62) : P.ink);
    ctx.stroke();
  }
}
function shade(fn, dark, sx = 30, sy = 10) {
  ctx.save(); ctx.beginPath(); fn(); ctx.clip();
  ctx.translate(sx, sy); ctx.beginPath(); ctx.rect(-4000, -4000, 8000, 8000); fn(); ctx.fillStyle = dark; ctx.fill('evenodd');
  ctx.restore();
}
function lineOnly(fn, color, lw = 6) { ctx.beginPath(); fn(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
const rr = (x, y, w, h, r) => ctx.roundRect(x, y, w, h, r);
const ell = (x, y, rx, ry, rot = 0) => ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
function softShadow(x, y, rx, ry, a = 0.28) {
  const g = ctx.createRadialGradient(x, y, 1, x, y, rx);
  g.addColorStop(0, `rgba(30,15,50,${a})`); g.addColorStop(1, 'rgba(30,15,50,0)');
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx); ctx.translate(-x, -y); ctx.fillStyle = g; ctx.fillRect(x - rx, y - rx, rx * 2, rx * 2); ctx.restore();
}
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(color, a)); g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function vgrad(c1, c2, y0 = 0, y1 = H) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c1); g.addColorStop(1, c2); return g; }

const grain = document.createElement('canvas'); grain.width = 540; grain.height = 960;
{ const g = grain.getContext('2d'); const im = g.createImageData(540, 960);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (rnd() - 0.5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); }

function dust(t, n, color = '#fff6d8', area = [0, 0, W, H], a = 0.6) {
  for (let i = 0; i < n; i++) {
    const x = area[0] + ((hash(i) * area[2] + t * 18 * (0.5 + hash(i + 9))) % area[2]);
    const y = area[1] + ((hash(i + 3) * area[3] - t * 22 * (0.4 + hash(i + 5)) + area[3] * 10) % area[3]);
    const r = 2 + hash(i + 7) * 5, tw = 0.5 + 0.5 * Math.sin(t * 2 + i);
    ctx.fillStyle = rgba(color, a * tw); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  }
}
function lightBeam(x0, y0, x1, y1, w0, w1, color, a) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, rgba(color, a)); g.addColorStop(1, rgba(color, 0));
  const ang = Math.atan2(y1 - y0, x1 - x0) + Math.PI / 2;
  const dx0 = Math.cos(ang) * w0 / 2, dy0 = Math.sin(ang) * w0 / 2, dx1 = Math.cos(ang) * w1 / 2, dy1 = Math.sin(ang) * w1 / 2;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(x0 - dx0, y0 - dy0); ctx.lineTo(x0 + dx0, y0 + dy0); ctx.lineTo(x1 + dx1, y1 + dy1); ctx.lineTo(x1 - dx1, y1 - dy1); ctx.fill(); ctx.restore();
}

// ================================================================ personagem
function person(x, y, s, o = {}) {
  const t = o.t ?? 0;
  const skin = o.skin || P.skin, hair = o.hair || P.hair, shirt = o.shirt || P.shirt;
  const skinD = mix(skin, '#c9707a', 0.32), hairL = lt(hair, 0.35), hairD = dk(hair, 0.3);
  const breathe = 1 + 0.012 * Math.sin(t * 2.4 + (o.ph || 0));
  const bob = 4 * Math.sin(t * 2.4 + (o.ph || 0)), tilt = (o.tilt || 0) + 0.025 * Math.sin(t * 1.3 + (o.ph || 0));
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (!o.noShadow) softShadow(0, 440, 300, 40, 0.22);
  // tronco
  ctx.save(); ctx.scale(1, breathe);
  const torso = () => { ctx.moveTo(-235, 430); ctx.bezierCurveTo(-250, 150, -200, 50, -110, 30); ctx.lineTo(110, 30); ctx.bezierCurveTo(200, 50, 250, 150, 235, 430); ctx.closePath(); };
  ctx.beginPath(); torso(); ctx.fillStyle = vgrad(lt(shirt, 0.12), dk(shirt, 0.12), 30, 430); ctx.fill();
  shade(torso, rgba(dk(shirt, 0.5), 0.45), 70, 0);
  lineOnly(torso, dk(shirt, 0.55), 6);
  lineOnly(() => { ctx.moveTo(-150, 250); ctx.quadraticCurveTo(-120, 300, -140, 380); }, rgba(dk(shirt, 0.5), 0.6), 5);
  lineOnly(() => { ctx.moveTo(140, 230); ctx.quadraticCurveTo(160, 300, 130, 360); }, rgba(dk(shirt, 0.5), 0.6), 5);
  shape(() => { ctx.moveTo(-78, 30); ctx.quadraticCurveTo(0, 120, 78, 30); ctx.quadraticCurveTo(0, 70, -78, 30); }, lt(shirt, 0.45));
  ctx.restore();
  // cabeça
  ctx.save(); ctx.translate(0, bob); ctx.rotate(tilt);
  shape(() => rr(-46, -50, 92, 95, 26), skin);
  shade(() => rr(-46, -50, 92, 95, 26), rgba(skinD, 0.7), 0, -48);
  for (const sx of [-1, 1]) { shape(() => ell(sx * 150, -188, 30, 42), skin); shape(() => ell(sx * 152, -186, 13, 22), skinD, { line: false }); }
  if (o.style === 'pony') {
    const sw = Math.sin(t * 3 + (o.ph || 0)) * 0.15;
    ctx.save(); ctx.translate(120, -300); ctx.rotate(0.5 + sw);
    shape(() => { ctx.moveTo(0, 0); ctx.bezierCurveTo(90, 40, 110, 200, 40, 300); ctx.bezierCurveTo(10, 200, -20, 80, 0, 0); }, hair);
    lineOnly(() => { ctx.moveTo(20, 40); ctx.bezierCurveTo(70, 90, 70, 180, 40, 250); }, rgba(hairL, 0.8), 8);
    ctx.restore();
  }
  const face = () => ell(0, -200, 150, 166);
  shape(face, skin, { stroke: dk(skin, 0.5) });
  shade(face, rgba(skinD, 0.55), 46, 14);
  for (const sx of [-1, 1]) { ctx.save(); ctx.globalAlpha = 0.42; glow(sx * 86, -140, 46, '#ff7f8f', 0.8); ctx.restore(); }
  const hairFront = () => {
    if (o.style === 'curly') {
      ctx.moveTo(-160, -170);
      for (let i = 0; i <= 10; i++) { const a = Math.PI + i * Math.PI / 10; ctx.arc(Math.cos(a) * 140, -235 + Math.sin(a) * 150, 48, a - 1.2, a + 1.2); }
      ctx.lineTo(160, -170); ctx.quadraticCurveTo(0, -250, -160, -170);
    } else {
      ctx.moveTo(-162, -175); ctx.bezierCurveTo(-185, -360, -60, -405, 20, -398); ctx.bezierCurveTo(140, -395, 190, -330, 162, -175);
      ctx.bezierCurveTo(150, -250, 120, -275, 90, -280); ctx.quadraticCurveTo(70, -240, 30, -262);
      ctx.quadraticCurveTo(0, -225, -40, -268); ctx.quadraticCurveTo(-80, -240, -100, -282); ctx.bezierCurveTo(-140, -270, -155, -230, -162, -175);
    }
  };
  shape(hairFront, hair, { stroke: hairD });
  shade(hairFront, rgba(hairD, 0.55), 30, 22);
  if (o.style !== 'curly') {
    lineOnly(() => { ctx.moveTo(-90, -350); ctx.bezierCurveTo(-30, -385, 40, -385, 95, -352); }, rgba(hairL, 0.9), 12);
    shape(() => { ctx.moveTo(10, -398); ctx.quadraticCurveTo(40, -450, 70, -440); ctx.quadraticCurveTo(45, -420, 40, -396); }, hair, { stroke: hairD });
  } else {
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-90 + i * 45, -340 + (i % 2) * 12, 12, 3.5, 5.8); ctx.strokeStyle = rgba(hairL, 0.8); ctx.lineWidth = 7; ctx.stroke(); }
  }
  const br = o.brow || 0;
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(sx * 70, -262 - br * 8); ctx.rotate(sx * (-0.08 + br * 0.22));
    shape(() => { ctx.moveTo(-40, 6); ctx.quadraticCurveTo(0, -12, 40, 4); ctx.quadraticCurveTo(0, -2, -40, 6); }, hairD, { lw: 4 });
    ctx.restore();
  }
  const blink = clamp(o.blink || 0, 0, 1), gl = o.glow || 0, lx = (o.look || 0) * 9;
  for (const sx of [-1, 1]) {
    const ex = sx * 68, ey = -196;
    if (gl > 0.01) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(ex, ey, 58, P.teal, 0.42 * gl); ctx.restore(); }
    const eh = 40 * (1 - blink) + 1.5;
    const eye = () => ell(ex, ey, 33, eh);
    shape(eye, P.white, { stroke: P.ink, lw: 5 });
    if (blink < 0.85) {
      ctx.save(); ctx.beginPath(); eye(); ctx.clip();
      const ic = gl > 0.01 ? P.teal : '#6b4128';
      const ig = ctx.createRadialGradient(ex + lx, ey + 4, 2, ex + lx, ey + 4, 22);
      ig.addColorStop(0, gl > 0.01 ? '#e9fffc' : lt(ic, 0.25)); ig.addColorStop(0.55, ic); ig.addColorStop(1, dk(ic, 0.45));
      ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(ex + lx, ey + 4, 22, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#140d1d'; ctx.beginPath(); ctx.arc(ex + lx, ey + 4, gl > 0.01 ? 8 : 10, 0, 6.283); ctx.fill();
      if (gl > 0.01) { ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ex + lx, ey + 4, 15, 0, 6.283); ctx.stroke(); }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + lx - 8, ey - 6, 6.5, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + lx + 7, ey + 11, 3, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(122,90,138,0.25)'; ctx.fillRect(ex - 40, ey - eh, 80, 12);
      ctx.restore();
    }
    lineOnly(() => { ctx.ellipse(ex, ey, 34, eh + 1, 0, Math.PI * 1.05, Math.PI * 1.95); }, P.ink, 8);
    lineOnly(() => { ctx.moveTo(ex + sx * 28, ey - eh * 0.75); ctx.lineTo(ex + sx * 40, ey - eh * 0.95); }, P.ink, 6);
  }
  lineOnly(() => { ctx.moveTo(4, -168); ctx.quadraticCurveTo(-12, -132, 8, -126); }, rgba(skinD, 0.9), 6);
  const m = o.mouth || 'neutral';
  if (m === 'neutral') lineOnly(() => { ctx.moveTo(-30, -88); ctx.quadraticCurveTo(0, -78, 30, -88); }, dk(skin, 0.62), 7);
  else if (m === 'smile') lineOnly(() => { ctx.moveTo(-42, -96); ctx.quadraticCurveTo(0, -56, 42, -96); }, dk(skin, 0.62), 7);
  else if (m === 'flat') lineOnly(() => { ctx.moveTo(-30, -86); ctx.lineTo(30, -86); }, dk(skin, 0.62), 7);
  else {
    const open = m === 'laugh' ? [52, 46] : m === 'yawn' ? [26, 40] : [17, 22];
    const mouth = () => { if (m === 'laugh') { ctx.moveTo(-open[0], -100); ctx.quadraticCurveTo(0, -100 + open[1] * 1.5, open[0], -100); ctx.closePath(); } else ell(0, -84, open[0], open[1]); };
    shape(mouth, '#7b2140', { stroke: dk(skin, 0.65), lw: 6 });
    ctx.save(); ctx.beginPath(); mouth(); ctx.clip();
    if (m === 'laugh') { ctx.fillStyle = '#fff'; ctx.fillRect(-50, -104, 100, 16); }
    ctx.fillStyle = '#ff7a8f'; ctx.beginPath(); ell(0, -84 + open[1] * 0.7, open[0] * 0.6, open[1] * 0.4); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.restore();
}

function povArm(x, y, ang, s = 1, open = 0, shirt = P.shirt) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  const sleeve = () => rr(-82, 20, 164, 720, 70);
  ctx.beginPath(); sleeve(); ctx.fillStyle = vgrad(lt(shirt, 0.08), dk(shirt, 0.2), 0, 700); ctx.fill();
  shade(sleeve, rgba(dk(shirt, 0.5), 0.5), 60, 0); lineOnly(sleeve, dk(shirt, 0.55), 6);
  shape(() => rr(-84, 10, 168, 60, 26), lt(shirt, 0.35));
  const skinD = mix(P.skin, '#c9707a', 0.35);
  const palm = () => rr(-62, -140, 124, 175, 54);
  shape(palm, P.skin); shade(palm, rgba(skinD, 0.6), 34, 0);
  for (let i = 0; i < 4; i++) {
    const fl = i === 1 || i === 2 ? 16 : 0;
    const f = () => rr(-58 + i * 30, -205 - fl + open * 34, 27, 96 + fl * 0.4, 14);
    shape(f, P.skin); shade(f, rgba(skinD, 0.55), 10, 0);
  }
  ctx.save(); ctx.translate(-70, -70); ctx.rotate(-0.7 + open * 0.3); shape(() => rr(-18, -60, 36, 90, 18), P.skin); ctx.restore();
  ctx.restore();
}

// ================================================================ planos
const phrases = TL.phrases;
const shots = [];
for (const p of phrases) {
  if (!shots.length || shots[shots.length - 1].name !== p.shot) shots.push({ name: p.shot, start: p.start, ps: [p] });
  else shots[shots.length - 1].ps.push(p);
}
shots[0].start = 0;
for (let i = 0; i < shots.length; i++) shots[i].end = i + 1 < shots.length ? shots[i + 1].start : TL.total;
const pStart = (shot, k) => { const s = shots.find(x => x.name === shot); return s && s.ps[k] ? s.ps[k].start : 0; };
const shotOf = (n) => shots.find(s => s.name === n);

// ---------------------------------------------------------------- banheiro
function bathroom(t, warm = 0) {
  ctx.fillStyle = vgrad(mix('#a9c2d6', '#f2d3b0', warm), mix('#6f88a3', '#c99a78', warm)); ctx.fillRect(0, 0, W, H);
  const sz = 135;
  for (let y = 0; y < 1500; y += sz) for (let x = 0; x < W; x += sz) {
    const c = mix('#d7e3ec', '#f6e5cf', warm);
    ctx.fillStyle = vgrad(lt(c, 0.15), dk(c, 0.08), y, y + sz); ctx.fillRect(x + 3, y + 3, sz - 6, sz - 6);
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + 45, y + 10); ctx.lineTo(x + 10, y + 45); ctx.fill();
  }
  for (const lx of [270, 540, 810]) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(lx, 135, 160, '#fff2c8', 0.5); ctx.restore();
    shape(() => rr(lx - 46, 108, 92, 52, 26), '#fff8e6', { stroke: '#d9c39a' });
  }
  shape(() => rr(118, 196, 844, 1100, 46), '#f1f4f6', { stroke: '#a7b3bd' });
  shape(() => rr(138, 216, 804, 1060, 32), '#cfd8df', { stroke: '#a7b3bd', lw: 4 });
}
function mirrorInside(drawFn, warm = 0) {
  ctx.save(); ctx.beginPath(); rr(150, 228, 780, 1036, 26); ctx.clip();
  ctx.fillStyle = vgrad(mix('#c6dce9', '#f5dcc0', warm), mix('#93b1c6', '#d6a983', warm), 228, 1264); ctx.fillRect(150, 228, 780, 1036);
  ctx.globalAlpha = 0.35;
  for (let y = 228; y < 1264; y += 160) for (let x = 150; x < 930; x += 160) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(x + 4, y + 4, 152, 152); }
  ctx.globalAlpha = 1;
  drawFn();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath(); ctx.moveTo(240, 228); ctx.lineTo(410, 228); ctx.lineTo(180, 1264); ctx.lineTo(10, 1264); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.beginPath(); ctx.moveTo(470, 228); ctx.lineTo(520, 228); ctx.lineTo(290, 1264); ctx.lineTo(240, 1264); ctx.fill();
  ctx.restore();
}
function sink() {
  softShadow(540, 1600, 520, 50, 0.3);
  ctx.fillStyle = vgrad('#7d4f33', '#5a3522', 1560, 1960); ctx.fillRect(0, 1560, W, 400);
  for (let i = 0; i < 9; i++) lineOnly(() => { ctx.moveTo(0, 1600 + i * 45); ctx.bezierCurveTo(300, 1590 + i * 45 + (i % 2) * 10, 700, 1612 + i * 45, W, 1598 + i * 45); }, 'rgba(40,20,10,0.25)', 3);
  shape(() => rr(50, 1430, 980, 150, 50), '#f7f9fb', { stroke: '#a7b3bd' });
  shade(() => rr(50, 1430, 980, 150, 50), 'rgba(120,140,160,0.25)', 0, 40);
  shape(() => rr(480, 1340, 120, 105, 24), '#d7dee4', { stroke: '#8f9aa4' });
  shape(() => rr(520, 1300, 40, 60, 16), '#c2cad1', { stroke: '#8f9aa4' });
  shape(() => rr(790, 1320, 90, 120, 18), '#7fd1c7');
  shape(() => rr(810, 1230, 14, 110, 7), '#ff8fa3'); shape(() => rr(846, 1220, 14, 120, 7), '#ffd45a');
  shape(() => rr(150, 1340, 110, 100, 22), '#e9a27a');
  for (let i = 0; i < 5; i++) { ctx.save(); ctx.translate(205, 1345); ctx.rotate(-1 + i * 0.5); shape(() => ell(0, -70, 22, 70), i % 2 ? '#5fbf74' : '#4aa864'); ctx.restore(); }
}

function sceneIntro(t) {
  bathroom(t, 0);
  const p3 = pStart('intro', 2), p4 = pStart('intro', 3);
  const refBlink = (t > p3 + 0.5 && t < p3 + 0.72) ? 1 : 0;
  const gl = sm(p4 + 0.2, p4 + 1.0, t) * (0.65 + 0.35 * Math.sin(t * 6));
  const mouth = t > p4 + 0.4 && t < p4 + 1.6 ? 'yawn' : 'neutral';
  mirrorInside(() => {
    if (t > p3 && t < p3 + 1.4) { ctx.save(); ctx.globalAlpha = 0.35 * (1 - sm(p3 + 0.9, p3 + 1.4, t)); ctx.globalCompositeOperation = 'lighter';
      person(W / 2 + 22, 1040, 1.5, { t, blink: 1, shirt: '#1f8c84', hair: '#1f8c84', skin: '#46f2df', noShadow: true }); ctx.restore(); }
    person(W / 2, 1040, 1.5, { t, blink: refBlink, glow: gl, mouth, noShadow: true });
  });
  sink();
  dust(t, 26, '#fff6d8', [0, 0, W, 1500], 0.35);
  if (t < pStart('intro', 1) + 0.6) {
    const a = back(sm(0, 0.35, t));
    ctx.save(); ctx.translate(W / 2, 300); ctx.rotate(-0.035); ctx.scale(a, a);
    softShadow(0, 120, 380, 40, 0.35);
    shape(() => rr(-440, -110, 880, 220, 36), P.red, { stroke: dk(P.red, 0.5), lw: 8 });
    shape(() => rr(-420, -90, 840, 30, 15), 'rgba(255,255,255,0.18)', { line: false });
    ctx.fillStyle = '#fff'; ctx.font = '64px Pop'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('E SE VOCÊ VISSE', 0, -38); ctx.fillStyle = P.yellow; ctx.fillText('10s NO FUTURO?', 0, 44);
    ctx.restore();
  }
}

// ---------------------------------------------------------------- cozinha
function sceneCafe(t) {
  ctx.fillStyle = vgrad('#ffe3bd', '#f4c58f'); ctx.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 90) for (let y = 620; y < 900; y += 90) { ctx.fillStyle = (x / 90 + y / 90) % 2 ? '#fbeedd' : '#f3dcc1'; ctx.fillRect(x, y, 90, 90); }
  shape(() => rr(600, 150, 400, 440, 26), '#f9f2e6', { stroke: '#c9a77c', lw: 8 });
  ctx.save(); ctx.beginPath(); rr(625, 175, 350, 390, 14); ctx.clip();
  ctx.fillStyle = vgrad('#8fd2ff', '#ffe6b8', 175, 565); ctx.fillRect(625, 175, 350, 390);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(900, 260, 150, '#fff1b0', 0.8); ctx.restore();

  for (let yy = -310; yy < 270; yy += 8) { ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.fillRect(-400, yy, 700, 3); }

  ctx.fillStyle = '#fff'; ctx.font = '40px Pop'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('AO VIVO', -250, -242);
  for (const yy of [-140, 0]) { shape(() => ell(370, yy, 38, 38), '#d9c7a8'); lineOnly(() => { ctx.moveTo(370, yy); ctx.lineTo(370 + 26 * Math.cos(t + yy), yy + 26 * Math.sin(t + yy)); }, '#4a2914', 6); }
  ctx.restore();
  ctx.save(); ctx.translate(W / 2, 1320); ctx.rotate(0.035); const k = back(sm(shotOf('tv').start + 0.3, shotOf('tv').start + 0.7, t)); ctx.scale(k, k);
  softShadow(0, 90, 300, 30, 0.4);
  shape(() => rr(-290, -80, 580, 160, 30), P.yellow, { stroke: '#a8791a', lw: 8 });
  ctx.fillStyle = '#3a2508'; ctx.font = '74px Pop'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('COM ATRASO', 0, 4);
  ctx.restore();
}

// ---------------------------------------------------------------- carro
function sceneCarro(t) {
  ctx.fillStyle = vgrad('#78c3f2', '#ffe0b5', 0, 1050); ctx.fillRect(0, 0, W, 1050);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(200, 260, 280, '#fff1b8', 0.6); ctx.restore();
  for (const [c, yb, sp, amp] of [['#9fd1a0', 930, 60, 70], ['#6db577', 990, 140, 50]]) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, 1050); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, yb - amp * Math.sin((x + t * sp) * 0.006) - 30 * Math.sin((x + t * sp) * 0.017)); ctx.lineTo(W, 1050); ctx.fill(); }
  ctx.fillStyle = vgrad('#4a4d57', '#2f3138', 1050, H); ctx.fillRect(0, 1050, W, H);
  for (let i = 0; i < 6; i++) shape(() => rr(((i * 260 - t * 1100) % 1560 + 1560) % 1560 - 260, 1460, 170, 26, 13), '#f2f2f2', { line: false });
  const x = W / 2 + 150;
  const car = (cx, gh) => {
    ctx.save(); ctx.translate(cx, 1330);
    const body = () => { ctx.moveTo(-250, 30); ctx.lineTo(-250, -70); ctx.quadraticCurveTo(-245, -110, -195, -118); ctx.lineTo(-130, -118); ctx.lineTo(-75, -205); ctx.lineTo(105, -205); ctx.lineTo(175, -118); ctx.lineTo(215, -110); ctx.quadraticCurveTo(255, -100, 255, -60); ctx.lineTo(255, 30); ctx.closePath(); };
    if (gh) { ctx.setLineDash([22, 16]); lineOnly(body, P.red, 6); ctx.setLineDash([]); ctx.fillStyle = rgba(P.red, 0.12); ctx.beginPath(); body(); ctx.fill(); for (const wx of [-150, 150]) { ctx.setLineDash([16, 12]); lineOnly(() => ell(wx, 36, 54, 54), P.red, 5); ctx.setLineDash([]); } }
    else {
      softShadow(0, 90, 290, 24, 0.5);
      ctx.beginPath(); body(); ctx.fillStyle = vgrad('#ff6a5c', '#c9263a', -205, 30); ctx.fill(); shade(body, 'rgba(90,10,40,0.35)', 0, 55); lineOnly(body, '#7a1428', 6);
      shape(() => { ctx.moveTo(-62, -188); ctx.lineTo(10, -188); ctx.lineTo(10, -124); ctx.lineTo(-108, -124); ctx.closePath(); }, '#bfe8ff', { stroke: '#7a1428', lw: 5 });
      shape(() => { ctx.moveTo(28, -188); ctx.lineTo(98, -188); ctx.lineTo(150, -124); ctx.lineTo(28, -124); ctx.closePath(); }, '#bfe8ff', { stroke: '#7a1428', lw: 5 });
      shape(() => rr(225, -84, 26, 28, 9), '#fff3a8');
      lightBeam(250, -70, 700, -40, 30, 220, '#fff3a8', 0.35);
      for (const wx of [-150, 150]) { ctx.save(); ctx.translate(wx, 36); ctx.rotate(t * 20); shape(() => ell(0, 0, 56, 56), '#2a2a33'); shape(() => ell(0, 0, 26, 26), '#c4c7cf'); lineOnly(() => { ctx.moveTo(-20, 0); ctx.lineTo(20, 0); }, '#7d818a', 5); ctx.restore(); }
    }
    ctx.restore();
  };
  car(x - 360, true); car(x, false);
  for (let i = 0; i < 4; i++) lineOnly(() => { ctx.moveTo(x - 280 - i * 20, 1250 + i * 26); ctx.lineTo(x - 560 - i * 40, 1250 + i * 26); }, 'rgba(255,255,255,0.6)', 7);
  lineOnly(() => { ctx.moveTo(x - 360, 1080); ctx.lineTo(x, 1080); }, '#ffffff', 8);
  for (const xx of [x - 360, x]) lineOnly(() => { ctx.moveTo(xx, 1050); ctx.lineTo(xx, 1110); }, '#ffffff', 8);
  ctx.textAlign = 'center'; ctx.font = '104px Pop'; ctx.lineWidth = 16; ctx.strokeStyle = '#2a1d3d'; ctx.strokeText('2,2 m', x - 180, 1010); ctx.fillStyle = '#fff'; ctx.fillText('2,2 m', x - 180, 1010);
  ctx.save(); ctx.translate(W / 2, 470); ctx.rotate(-0.03); softShadow(0, 70, 260, 24, 0.3);
  shape(() => rr(-230, -60, 460, 120, 60), '#ffffff', { stroke: '#cfd6dd' }); ctx.fillStyle = '#2a1d3d'; ctx.font = '60px Pop'; ctx.textBaseline = 'middle'; ctx.fillText('100 km/h', 0, 4); ctx.restore();
}

// ---------------------------------------------------------------- sol
function sceneSol(t) {
  const g = ctx.createRadialGradient(300, 600, 50, 540, 960, 1300); g.addColorStop(0, '#3a1f5e'); g.addColorStop(0.5, '#141a3e'); g.addColorStop(1, '#070a1a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(700, 1500, 500, '#6a3fbf', 0.18); glow(200, 1200, 400, '#3f7fbf', 0.12); ctx.restore();
  for (let i = 0; i < 120; i++) { const tw = 0.5 + 0.5 * Math.sin(t * 2 + i); ctx.fillStyle = rgba('#ffffff', (0.25 + 0.6 * hash(i + 5)) * tw); ctx.beginPath(); ctx.arc(hash(i) * W, hash(i + 1) * H, 1.5 + hash(i + 2) * 3, 0, 6.28); ctx.fill(); }
  const sx = 260, sy = 520;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(sx, sy, 420, '#ffb347', 0.55); glow(sx, sy, 260, '#ffe27a', 0.6); ctx.restore();
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * 0.2);
  for (let i = 0; i < 14; i++) { ctx.rotate(Math.PI * 2 / 14); shape(() => { ctx.moveTo(-26, -175); ctx.lineTo(0, -235 - 20 * Math.sin(t * 3 + i)); ctx.lineTo(26, -175); }, '#ffcf4a', { line: false }); }
  ctx.restore();
  ctx.beginPath(); ctx.arc(sx, sy, 170, 0, 6.28); ctx.fillStyle = vgrad('#fff1a0', '#ffb43a', sy - 170, sy + 170); ctx.fill(); lineOnly(() => ctx.arc(sx, sy, 170, 0, 6.28), '#e08a1e', 8);
  for (let i = 0; i < 6; i++) { ctx.fillStyle = 'rgba(230,140,30,0.35)'; ctx.beginPath(); ctx.arc(sx - 90 + hash(i) * 180, sy - 90 + hash(i + 1) * 180, 14 + hash(i + 2) * 18, 0, 6.28); ctx.fill(); }
  const ex = 820, ey = 1290;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(ex, ey, 190, '#6fb8ff', 0.35); ctx.restore();
  const earth = () => ctx.arc(ex, ey, 120, 0, 6.28);
  ctx.beginPath(); earth(); ctx.fillStyle = vgrad('#5fb0ff', '#2a6fc9', ey - 120, ey + 120); ctx.fill();
  ctx.save(); ctx.beginPath(); earth(); ctx.clip();
  for (const [dx, dy, r] of [[-50, -40, 55], [40, 30, 45], [-10, 70, 35], [70, -60, 30]]) shape(() => ell(ex + dx, ey + dy, r, r * 0.7, 0.5), '#4cbf6a', { line: false });
  ctx.fillStyle = 'rgba(10,15,50,0.45)'; ctx.beginPath(); ctx.arc(ex + 70, ey + 60, 150, 0, 6.28); ctx.fill();
  ctx.restore(); lineOnly(earth, '#1d4f9a', 6);
  const k = (t * 0.33) % 1;
  ctx.setLineDash([26, 22]); ctx.lineDashOffset = -t * 120; lineOnly(() => { ctx.moveTo(sx + 130, sy + 130); ctx.lineTo(ex - 90, ey - 90); }, 'rgba(255,212,90,0.55)', 8); ctx.setLineDash([]); ctx.lineDashOffset = 0;
  const px = lerp(sx + 130, ex - 90, k), py = lerp(sy + 130, ey - 90, k);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(px, py, 60, '#fff3b0', 0.9); ctx.restore();
  ctx.save(); ctx.translate(590, 840); ctx.rotate(0.62); ctx.textAlign = 'center'; ctx.font = '110px Pop'; ctx.lineWidth = 18; ctx.strokeStyle = '#0b0f2a'; ctx.strokeText('8 MIN', 0, 0); ctx.fillStyle = '#fff'; ctx.fillText('8 MIN', 0, 0); ctx.restore();
}

// ---------------------------------------------------------------- fecho
function sceneFecho(t) {
  const warm = sm(shotOf('fecho').start, shotOf('fecho').start + 2, t);
  bathroom(t, warm);
  const gl = 1 - sm(pStart('fecho', 1), pStart('fecho', 2), t);
  mirrorInside(() => person(W / 2, 1040, 1.5, { t, glow: gl * 0.9, mouth: t > pStart('fecho', 2) ? 'smile' : 'neutral', noShadow: true }), warm);
  sink();
  lightBeam(0, 300, 700, 1400, 200, 900, '#ffd9a0', 0.18 * warm);
  dust(t, 30, '#ffe9c0', [0, 0, W, 1500], 0.45);
}

const SCENES = { intro: sceneIntro, cafe: sceneCafe, rua: sceneRua, celular: sceneCelular, problema: sceneProblema,
  virada: sceneVirada, cerebro: sceneCerebro, tv: sceneTv, carro: sceneCarro, sol: sceneSol, fecho: sceneFecho };

// ================================================================ capítulos
const CHAP = { cafe: ['1', 'O CAFÉ'], rua: ['2', 'A RUA'], celular: ['3', 'O CELULAR'], problema: ['4', 'O PROBLEMA'],
  virada: ['★', 'A VIRADA'], cerebro: ['★', 'A VIRADA'], tv: ['★', 'A VIRADA'], carro: ['★', 'A VIRADA'], sol: ['★', 'A VIRADA'] };
const chapters = TL.chapters || [];
function badge(sh, t) {
  const c = CHAP[sh.name]; if (!c) return;
  const chap = ['virada', 'cerebro', 'tv', 'carro', 'sol'].includes(sh.name) ? shotOf('virada') : sh;
  const k = back(sm(chap.start, chap.start + 0.4, t));
  ctx.font = '54px Pop'; const tw = ctx.measureText(c[1]).width;
  ctx.save(); ctx.translate(lerp(-200 - tw, 50, k), 96);
  shape(() => rr(0, 0, 150 + tw, 116, 58), 'rgba(20,14,40,0.72)', { line: false });
  shape(() => ell(58, 58, 46, 46), P.red, { stroke: '#ffffff', lw: 5 });
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '56px Pop'; ctx.fillText(c[0], 58, 62);
  ctx.textAlign = 'left'; ctx.font = '54px Pop'; ctx.fillText(c[1], 122, 62);
  ctx.restore();
}
function chapterCard(t) {
  for (const ch of chapters) {
    if (t < ch.start - 0.15 || t > ch.end + 0.15) continue;
    const c = CHAP[ch.shot]; const k = (t - (ch.start - 0.15)) / (ch.end - ch.start + 0.3);
    const inK = sm(0, 0.22, k), outK = sm(0.78, 1, k);
    const x0 = lerp(W, 0, inK) - lerp(0, W, outK);
    ctx.save();
    ctx.fillStyle = vgrad('#1a1240', '#07051a'); ctx.fillRect(x0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter'; glow(x0 + W / 2, H / 2, 600, P.teal, 0.18); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = P.teal; ctx.fillRect(x0 - 14, 0, 14, H);
    ctx.translate(x0 + W / 2, H / 2 - 40);
    const s = 0.94 + 0.08 * sm(0.15, 0.85, k); ctx.scale(s, s);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (c[0] !== '★') { ctx.font = '260px Pop'; ctx.lineWidth = 7; ctx.strokeStyle = P.teal; ctx.strokeText(c[0], 0, -180); }
    else { ctx.font = '170px Pop'; ctx.fillStyle = P.yellow; ctx.fillText('★', 0, -170); }
    ctx.font = '124px Pop'; ctx.fillStyle = '#fff'; ctx.fillText(c[1], 0, 40);
    const lw = 520 * sm(0.2, 0.6, k); shape(() => rr(-lw / 2, 130, lw, 14, 7), P.red, { line: false });
    ctx.restore();
  }
}
function iris(t, sh) {
  if (!['cerebro', 'tv', 'carro', 'sol', 'fecho'].includes(sh.name)) return;
  const k = sm(sh.start, sh.start + 0.45, t); if (k >= 1) return;
  const r = 1200 * k;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H / 2, Math.max(1, r), 0, 6.28, true); ctx.fillStyle = '#05040c'; ctx.fill('evenodd');
  ctx.beginPath(); ctx.arc(W / 2, H / 2, Math.max(1, r), 0, 6.28); ctx.strokeStyle = P.teal; ctx.lineWidth = 18; ctx.stroke(); ctx.restore();
}

// ================================================================ legenda
const KEY = /^(futuro|espelho|antes|reflexo|xícara|ar|caído|carro|salvar|vácuo|crush|estranho|passado|porra|sério|80|milissegundos|cérebro|atraso|2|metros|sol|8|minutos|agora|ninguém|superpoder|10|segundos)$/i;
const words = phrases.flatMap(p => p.words.map(w => ({ s: w[0], e: w[1], w: w[2] })));
function caption(t) {
  let cur = null; for (const w of words) { if (w.s <= t) cur = w; else break; }
  if (!cur || t > cur.e + 0.6 || t > TL.total - 0.6) return;
  for (const ch of chapters) if (t > ch.start - 0.1 && t < ch.end + 0.1) return;
  const raw = cur.w.replace(/[.,?!:]+$/, ''); const txt = raw.toUpperCase();
  const key = KEY.test(raw);
  const pop = back(sm(0, 0.16, t - cur.s)) * (key ? 1.06 : 1);
  ctx.save(); ctx.translate(W / 2, 1660); ctx.scale(pop, pop); ctx.rotate(key ? -0.03 : 0);
  let fs = key ? 128 : 108; ctx.font = `${fs}px Pop`;
  const tw = ctx.measureText(txt).width; if (tw > W - 120) { fs *= (W - 120) / tw; ctx.font = `${fs}px Pop`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(10,5,30,0.55)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
  ctx.lineWidth = 24; ctx.strokeStyle = '#140d22'; ctx.strokeText(txt, 0, 0);
  ctx.shadowColor = 'transparent';
  if (key) { const g = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2); g.addColorStop(0, '#ff8a6a'); g.addColorStop(1, '#ff3355'); ctx.fillStyle = g; } else ctx.fillStyle = '#ffffff';
  ctx.fillText(txt, 0, 0);
  ctx.restore();
}

// ================================================================ render
window.renderAt = (t) => {
  const sh = shots.find(s => t >= s.start && t < s.end) || shots[shots.length - 1];
  const u = t - sh.start, D = sh.end - sh.start;
  const sub = u % 2.3, zoom = 1 + 0.035 * (1 - sm(0, 0.35, sub)) + 0.04 * sm(0, D, u);
  const dx = 14 * Math.sin(t * 0.5), dy = 10 * Math.sin(t * 0.37);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.translate(W / 2 + dx, H / 2 + dy); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  (SCENES[sh.name] || sceneIntro)(t);
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  iris(t, sh);
  badge(sh, t);
  caption(t);
  chapterCard(t);
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.82); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(20,8,40,0.42)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grain, -hash(Math.floor(t * 30)) * 400, -hash(Math.floor(t * 30) + 1) * 400, W + 400, H + 400); ctx.restore();
  return cv.toDataURL('image/jpeg', 0.93);
};
window.TOTAL = TL.total;
window.SHOTS = shots.map(s => [s.name, s.start, s.end]);
document.title = 'ready';
