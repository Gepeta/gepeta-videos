}

  for (const a of arms) { a.sh.rotation.set(0, 0, 0); a.el.rotation.set(0, 0, 0); a.end.rotation.set(0, 0, 0); }
  for (const l of legs) { l.sh.rotation.set(0, 0, 0); l.el.rotation.set(0, 0, 0); l.end.rotation.set(0, 0, 0); }
  torso.rotation.set(0, 0, 0); head.rotation.set(0, 0, 0); neck.rotation.set(0, 0, 0); hips.position.y = 0.98; hips.rotation.set(0, 0, 0);
  const idle = Math.sin(t * 1.8);
  // andando até a marca
  const walkK = sm(0.3, 2.85, t);
  const walking = t < 2.85 ? 1 - sm(2.55, 2.85, t) : 0;
  gep.position.set(0, 0, lerp(-9.5, 0, walkK));
  gep.rotation.y = 0;
  const ph = t * 7.2;
  legs.forEach((l, i) => { const s = i ? 1 : -1; l.sh.rotation.x = walking * 0.55 * Math.sin(ph + (s > 0 ? Math.PI : 0)); l.el.rotation.x = walking * (0.5 + 0.5 * Math.sin(ph + (s > 0 ? Math.PI : 0) - 1.2)) * 0.9; });
  arms.forEach((a, i) => { const s = i ? 1 : -1; a.sh.rotation.x = walking * 0.5 * Math.sin(ph + (s > 0 ? 0 : Math.PI)); a.sh.rotation.z = s * 0.06; a.el.rotation.x = -0.25 * walking - 0.12; });
  hips.position.y += walking * 0.035 * Math.abs(Math.sin(ph)) + (1 - walking) * 0.006 * idle;
  torso.rotation.y = walking * 0.08 * Math.sin(ph);
  // respiração / leve balanço parado
  torso.rotation.x = (1 - walking) * 0.015 * idle;

  // "Olá": acena com a mão direita
  const wave = sm(T_OLA - 0.35, T_OLA - 0.05, t) * (1 - sm(T_ME - 0.05, T_ME + 0.2, t));
  R.sh.rotation.z = lerp(R.sh.rotation.z, -2.55, wave); R.sh.rotation.x = lerp(R.sh.rotation.x, -0.2, wave);
  R.el.rotation.z = lerp(0, -0.35 + 0.45 * Math.sin(t * 15), wave); R.el.rotation.x = lerp(R.el.rotation.x, -0.2, wave);
  head.rotation.z += 0.08 * wave; head.rotation.x += -0.05 * wave;
  // "me chamo Gepeta": mão no peito, a outra aberta
  const self = sm(T_ME - 0.15, T_ME + 0.15, t) * (1 - sm(C2 - 0.25, C2, t));
  R.sh.rotation.x = lerp(R.sh.rotation.x, P_CHEST[0], self); R.sh.rotation.z = lerp(R.sh.rotation.z, P_CHEST[1], self);
  R.el.rotation.x = lerp(R.el.rotation.x, P_CHEST[2], self);
  Lf.sh.rotation.x = lerp(Lf.sh.rotation.x, -0.6, self); Lf.sh.rotation.z = lerp(Lf.sh.rotation.z, 0.5, self); Lf.el.rotation.x = lerp(Lf.el.rotation.x, -0.5, self);
  const nod = Math.exp(-Math.pow((t - T_GEP - 0.15) / 0.18, 2));
  head.rotation.x += 0.12 * nod * self - 0.04 * self;
  // pose final do ícone: mão no queixo, cabeça de lado
  const icon = sm(C2 - 0.25, C2 + 0.35, t);
  R.sh.rotation.x = lerp(R.sh.rotation.x, P_CHIN[0], icon); R.sh.rotation.z = lerp(R.sh.rotation.z, P_CHIN[1], icon);
  R.el.rotation.x = lerp(R.el.rotation.x, P_CHIN[2], icon); R.el.rotation.z = lerp(R.el.rotation.z, 0, icon);
  R.end.rotation.x = lerp(0, 0.3, icon);
  Lf.sh.rotation.x = lerp(Lf.sh.rotation.x, -0.35, icon); Lf.sh.rotation.z = lerp(Lf.sh.rotation.z, -0.2, icon); Lf.sh.rotation.y = lerp(0, 0.6, icon); Lf.el.rotation.x = lerp(Lf.el.rotation.x, -1.6, icon);
  head.rotation.z += 0.1 * icon; head.rotation.x += -0.08 * icon; head.rotation.y += -0.12 * icon;
  torso.rotation.y += 0.12 * icon;
  // olhar pra câmera depois de parar
  head.rotation.y += (1 - walking) * 0.04 * Math.sin(t * 0.9);

  // boca
  const mi = clamp(Math.round(t * 30), 0, MOUTH.length - 1); const mo = MOUTH.length ? MOUTH[mi] : 0;
  mouthOpen.scale.set(0.8 + mo * 0.5, 0.15 + mo * 1.0, 1); mouthOpen.visible = mo > 0.04; tongue.visible = mo > 0.35;
  smile.visible = mo <= 0.04; smile.scale.setScalar(1 + 0.15 * icon);
  brows.forEach(b => { b.b.position.y = 0.125 + 0.015 * mo + 0.012 * wave; b.b.rotation.z = b.s * (0.05 + 0.18 * icon); });
}

// ---------------------------------------------------------------- câmera e edição
function shot(t) {
  let pos, tgt, fov;
  if (t < C1) {
    const k = sm(0, C1, t);
    pos = V(lerp(1.1, 0.75, k), lerp(1.75, 1.6, k), lerp(6.4, 4.4, k)); tgt = V(lerp(-0.2, 0, k), 1.35, lerp(-8, -1, k)); fov = 52;
  } else if (t < C2) {
    const k = sm(C1, C2, t);
    pos = V(lerp(0.6, 0.4, k), lerp(1.62, 1.6, k), lerp(3.6, 3.2, k)); tgt = V(0, 1.42, 0); fov = 38;
  } else {
    const k = sm(C2, TOTAL, t);
    const a = lerp(-0.42, -0.2, k);
    pos = V(Math.sin(a) * lerp(3.3, 2.9, k), lerp(1.2, 1.3, k), Math.cos(a) * lerp(3.3, 2.9, k)); tgt = V(-0.05, 1.62, 0); fov = 40;
  }
  // punch-in nos cortes
  const cut = Math.min(Math.abs(t - C1), Math.abs(t - C2));
  if (t > C1 && cut < 0.2) fov *= 1 - 0.06 * (1 - cut / 0.2);
  // micro tremido de câmera na mão
  pos.x += 0.006 * Math.sin(t * 2.3) + 0.004 * Math.sin(t * 5.1); pos.y += 0.005 * Math.sin(t * 1.7 + 1);
  camera.position.copy(pos); camera.lookAt(tgt); camera.fov = fov; camera.updateProjectionMatrix();
  // luz de recorte azul e preenchimento quente no plano final
  rim.intensity = 2.2 * sm(C2 - 0.2, C2 + 0.4, t) + 0.6;
  fill.intensity = t > C1 ? 2.2 : 0;
}

// ---------------------------------------------------------------- pós
const composer = new EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const ao = new GTAOPass(scene, camera, W, H); ao.output = GTAOPass.OUTPUT.Default;
ao.updateGtaoMaterial({ radius: 0.45, distanceExponent: 1.5, thickness: 1, scale: 1.2, samples: 12 });
composer.addPass(ao);
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.5, 0.6, 0.9); composer.addPass(bloom);
composer.addPass(new OutputPass());

const out = document.getElementById('out'); const ctx = out.getContext('2d');
await document.fonts.load('100px Pop');
const back = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function caption(t) {
  let cur = null; for (const w of words) { if (w.s <= t) cur = w; else break; }
  if (!cur || t > C2 + 0.2) return;
  const raw = cur.w.replace(/[.,?!]+$/, ''); const txt = raw.charAt(0).toUpperCase() + raw.slice(1);
  const key = /gepeta/i.test(raw);
  const pop = 1 + 0.28 * (1 - sm(0, 0.12, t - cur.s));
  ctx.save(); ctx.translate(W / 2, 1360); ctx.scale(pop, pop); ctx.rotate(key ? -0.04 : 0);
  ctx.font = `${key ? 130 : 104}px Pop`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.lineWidth = 20; ctx.strokeStyle = '#111'; ctx.strokeText(txt, 0, 0);
  ctx.shadowColor = 'transparent'; ctx.fillStyle = key ? '#ffd43b' : '#fff'; ctx.fillText(txt, 0, 0);
  ctx.restore();
}
function titleCard(t) {
  const a = clamp((t - (C2 + 0.35)) / 0.4, 0, 1); if (a <= 0) return;
  const s = back(a);
  ctx.save(); ctx.translate(W / 2, 300); ctx.scale(s, s); ctx.rotate(-0.035);
  ctx.font = '190px Pop'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(255,200,60,0.75)'; ctx.shadowBlur = 50;
  ctx.lineWidth = 26; ctx.strokeStyle = '#111'; ctx.strokeText('GEPETA', 0, 0);
  ctx.shadowBlur = 0; ctx.fillStyle = '#ffd43b'; ctx.fillText('GEPETA', 0, 0);
  ctx.restore();
  const b = clamp((t - (C2 + 0.75)) / 0.35, 0, 1); if (b <= 0) return;
  ctx.save(); ctx.globalAlpha = b; ctx.translate(W / 2, 445 + 20 * (1 - b));
  ctx.font = '62px Pop'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 12; ctx.strokeStyle = '#111'; ctx.strokeText('vídeos que você não esperava', 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillText('vídeos que você não esperava', 0, 0);
  ctx.restore();
}
const grainC = document.createElement('canvas'); grainC.width = 270; grainC.height = 480; const gx = grainC.getContext('2d');
function grain(t) {
  const id = gx.createImageData(270, 480); const d = id.data; let s = Math.floor(t * 30) * 9973 + 7;
  for (let i = 0; i < d.length; i += 4) { s = (s * 16807) % 2147483647; const v = (s / 2147483647) * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 20; }
  gx.putImageData(id, 0, 0); ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.imageSmoothingEnabled = true; ctx.drawImage(grainC, 0, 0, W, H); ctx.restore();
}

window.renderAt = (t) => {
  lampState(t); pose(t); shot(t);
  dust.position.y = 0.04 * Math.sin(t * 0.4); dust.rotation.y = 0.002 * t;
  composer.render();
  ctx.drawImage(renderer.domElement, 0, 0);
  const g = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.25, W / 2, H / 2, H * 0.72); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  grain(t);
  // flash branco no corte final
  const f = Math.max(0, 1 - Math.abs(t - C2) / 0.12); if (f > 0) { ctx.fillStyle = `rgba(255,250,235,${0.5 * f})`; ctx.fillRect(0, 0, W, H); }
  // fade de entrada e saída
  const fade = Math.max(1 - sm(0, 0.35, t), sm(TOTAL - 0.35, TOTAL, t)); if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  titleCard(t);
  caption(t);
  return out.toDataURL('image/jpeg', 0.93);
};
window.TOTAL = TOTAL;
window.SHOTS = [['corredor', 0, C1], ['fala', C1, C2], ['icone', C2, TOTAL]];
document.title = 'ready';
</script></body></html>
