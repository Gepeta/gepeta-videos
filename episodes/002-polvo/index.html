<script type="module">
import * as THREE from 'three';
const W = 1080, H = 1920;
const TL = await (await fetch('./timeline.json')).json();

// ---------------------------------------------------------------- utilidades
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.85, metalness: 0, ...o });

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const WATER = new THREE.Color(0x1f8fb8);
scene.background = WATER.clone();
scene.fog = new THREE.FogExp2(WATER.clone(), 0.045);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 200);

const hemi = new THREE.HemisphereLight(0xbff4ff, 0xc8a46a, 1.3); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3d6, 2.2);
sun.position.set(6, 14, 4); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
scene.add(sun); scene.add(sun.target);

// ---------------------------------------------------------------- fundo do mar
function seabed() {
  const g = new THREE.PlaneGeometry(80, 80, 60, 60); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, 0.18 * Math.sin(x * 0.7) * Math.cos(z * 0.6) + 0.12 * Math.sin(x * 1.9 + z * 1.3) + (rnd() - 0.5) * 0.08);
  }
  const ng = g.toNonIndexed(); ng.computeVertexNormals();
  const cols = []; for (let i = 0; i < ng.attributes.position.count / 3; i++) {
    const k = 0.9 + rnd() * 0.12; const c = [0.93 * k, 0.8 * k, 0.55 * k]; cols.push(...c, ...c, ...c);
  }
  ng.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const m = new THREE.Mesh(ng, mat(0xffffff, { vertexColors: true })); m.receiveShadow = true; return m;
}
scene.add(seabed());

const decor = new THREE.Group(); scene.add(decor);
const weeds = [];
function rock(x, z, s, c = 0x8a8178) {
  const g = new THREE.DodecahedronGeometry(s, 0); const m = new THREE.Mesh(g, mat(c));
  m.position.set(x, s * 0.35, z); m.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3); m.scale.y = 0.6 + rnd() * 0.4;
  m.castShadow = m.receiveShadow = true; decor.add(m); return m;
}
function weed(x, z, h, c) {
  const grp = new THREE.Group(); grp.position.set(x, 0, z); decor.add(grp);
  const segs = []; let parent = grp;
  for (let i = 0; i < 6; i++) {
    const s = new THREE.Group(); s.position.y = i === 0 ? 0 : h / 6;
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.16, h / 6, 0.06), mat(c)); b.position.y = h / 12; b.castShadow = true;
    s.add(b); parent.add(s); parent = s; segs.push(s);
  }
  weeds.push({ segs, ph: rnd() * 6 }); return grp;
}
function coral(x, z, c) {
  const grp = new THREE.Group(); grp.position.set(x, 0, z); decor.add(grp);
  for (let i = 0; i < 5; i++) {
    const m = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.8 + rnd() * 0.7, 5), mat(c));
    m.position.set((rnd() - 0.5) * 0.6, 0.4, (rnd() - 0.5) * 0.6); m.rotation.set((rnd() - 0.5) * 0.8, 0, (rnd() - 0.5) * 0.8);
    m.castShadow = true; grp.add(m);
  }
  const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45, 0), mat(c)); ball.position.y = 0.2; grp.add(ball);
}
for (let i = 0; i < 40; i++) { const a = rnd() * 6.28, r = 5 + rnd() * 22; rock(Math.cos(a) * r, Math.sin(a) * r, 0.3 + rnd() * 1.2); }
for (let i = 0; i < 45; i++) { const a = rnd() * 6.28, r = 4 + rnd() * 20; if (Math.cos(a) * r > -2 && Math.sin(a) * r > -1 && r < 13) { r; continue; } weed(Math.cos(a) * r, Math.sin(a) * r, 1.6 + rnd() * 2.6, [0x2f9e44, 0x51b84a, 0x2b7a3a][i % 3]); }
for (let i = 0; i < 22; i++) { const a = rnd() * 6.28, r = 5 + rnd() * 18; coral(Math.cos(a) * r, Math.sin(a) * r, [0xff7a8a, 0xffa94d, 0xb197fc, 0xff6b6b][i % 4]); }

// raios de luz
const rayTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 256); const g2 = x.createLinearGradient(0, 0, 64, 0);
  x.globalCompositeOperation = 'destination-in'; g2.addColorStop(0, 'rgba(0,0,0,0)'); g2.addColorStop(0.5, 'rgba(0,0,0,1)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g2; x.fillRect(0, 0, 64, 256); return new THREE.CanvasTexture(c); })();
const rays = [];
for (let i = 0; i < 14; i++) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.5 + rnd() * 2, 22), new THREE.MeshBasicMaterial({ map: rayTex, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
  m.position.set((rnd() - 0.5) * 30, 10, (rnd() - 0.5) * 30); m.rotation.set(0, rnd() * 3, 0.35); rays.push({ m, ph: rnd() * 6 }); scene.add(m);
}
// neve marinha
const snowG = new THREE.BufferGeometry(); const sp = [];
for (let i = 0; i < 700; i++) sp.push((rnd() - 0.5) * 30, rnd() * 10, (rnd() - 0.5) * 30);
snowG.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const snow = new THREE.Points(snowG, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.7 })); scene.add(snow);
// bolhas
const bubbleM = new THREE.MeshStandardMaterial({ color: 0xe8fbff, transparent: true, opacity: 0.55, roughness: 0.1, metalness: 0.2 });
const bubbleG = new THREE.IcosahedronGeometry(1, 1);
const bubbles = new THREE.InstancedMesh(bubbleG, bubbleM, 160); scene.add(bubbles);
const bubbleData = []; for (let i = 0; i < 160; i++) bubbleData.push({ a: rnd() * 6.28, r: rnd(), s: 0.03 + rnd() * 0.07, ph: rnd(), sp: 0.6 + rnd() * 0.8 });

// ---------------------------------------------------------------- polvo
function makeOctopus(o = {}) {
  const skin = new THREE.Color(o.skin ?? 0xc9543a), pale = new THREE.Color(o.pale ?? 0xe8a089);
  const root = new THREE.Group();
  const bodyG = new THREE.Group(); root.add(bodyG);

  // manto: esfera alongada, com cor variando do topo pra barriga
  let g = new THREE.IcosahedronGeometry(1, 3).toNonIndexed();
  g.scale(0.92, 1.25, 0.92);
  const p = g.attributes.position; const cols = [];
  for (let i = 0; i < p.count; i += 3) {
    const cy = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3;
    const cx = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3;
    const cz = (p.getZ(i) + p.getZ(i + 1) + p.getZ(i + 2)) / 3;
    let c = cy < -0.35 ? pale : skin;
    if (Math.sin(cx * 9.3) * Math.sin(cz * 8.7 + 1) * Math.sin(cy * 7.9) > 0.35) c = pale;
    for (let k = 0; k < 3; k++) cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); g.computeVertexNormals();
  const mantleMat = mat(0xffffff, { vertexColors: true });
  const mantle = new THREE.Mesh(g, mantleMat); mantle.castShadow = true; mantle.position.y = 0.55; bodyG.add(mantle);

  // cabeça (bolha menor na base do manto), onde ficam os olhos
  const headMat = mat(skin.getHex());
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.78, 2), headMat);
  head.scale.set(1.15, 0.86, 1.0); head.position.y = -0.38; head.castShadow = true; bodyG.add(head);

  // olhos: pupila horizontal, marca registrada do polvo
  const eyes = [];
  for (const sx of [-1, 1]) {
    const e = new THREE.Group(); e.position.set(sx * 0.62, -0.28, 0.34); bodyG.add(e);
    const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 2), mat(0xf6e9cf)); ball.castShadow = true; e.add(ball);
    const lid = new THREE.Mesh(new THREE.SphereGeometry(0.315, 12, 8, 0, 6.283, 0, 1.2), headMat);
    lid.rotation.x = -0.5; e.add(lid);
    const pup = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.085, 0.07), mat(0x14100e));
    pup.position.set(sx * 0.07, 0, 0.27); e.add(pup);
    eyes.push({ g: e, pup, lid, sx });
  }

  // 8 braços: cada um é uma corrente de segmentos, a rotação vai somando e enrola
  const SEG = 11, arms = [];
  const armMat = mat(skin.getHex());
  const suckMat = mat(0xf0b9a6);
  for (let a = 0; a < 8; a++) {
    const th = (a / 8) * Math.PI * 2 + 0.2;
    const base = new THREE.Group();
    base.position.set(Math.cos(th) * 0.52, -0.72, Math.sin(th) * 0.52);
    base.rotation.y = -th + Math.PI / 2;
    bodyG.add(base);
    const segs = []; let parent = base;
    for (let s = 0; s < SEG; s++) {
      const r0 = 0.23 * (1 - s / SEG) + 0.05, r1 = 0.23 * (1 - (s + 1) / SEG) + 0.04, L = 0.44;
      const grp = new THREE.Group(); grp.position.y = s === 0 ? 0 : -0.44; parent.add(grp);
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, L, 6), armMat);
      m.position.y = -L / 2; m.castShadow = true; grp.add(m);
      if (s < 9) {
        const sk = new THREE.Mesh(new THREE.CylinderGeometry(r1 * 0.55, r1 * 0.55, 0.03, 6), suckMat);
        sk.rotation.x = Math.PI / 2; sk.position.set(0, -L * 0.55, r0 * 0.75); grp.add(sk);
      }
      segs.push(grp); parent = grp;
    }
    arms.push({ base, segs, th, a });
  }

  // corações e neurônios: só aparecem quando o plano pede
  const organs = new THREE.Group(); organs.visible = false; bodyG.add(organs);
  const heartMat = new THREE.MeshStandardMaterial({ color: 0xff4d5e, emissive: 0xff2740, emissiveIntensity: 1.2, flatShading: true, roughness: 0.5, depthTest: false, transparent: true });
  const hearts = [];
  for (const [hx, hy, hs] of [[0, 0.95, 0.3], [-0.45, 0.45, 0.24], [0.45, 0.45, 0.24]]) {
    const h = new THREE.Mesh(new THREE.IcosahedronGeometry(hs, 1), heartMat);
    h.position.set(hx, hy, 0.55); h.renderOrder = 20; organs.add(h); hearts.push(h);
  }
  const nerveMat = new THREE.MeshStandardMaterial({ color: 0x8be9ff, emissive: 0x3fd0ff, emissiveIntensity: 1.6, flatShading: true, depthTest: false, transparent: true });
  const nerves = new THREE.Group(); nerves.visible = false; bodyG.add(nerves);
  const nerveDots = [];
  for (const arm of arms) {
    for (let s = 1; s < SEG; s += 2) {
      const d = new THREE.Mesh(new THREE.IcosahedronGeometry(0.14, 0), nerveMat);
      arm.segs[s].add(d); d.position.set(0, -0.22, 0.12); d.renderOrder = 20; nerveDots.push({ d, s, a: arm.a });
      d.visible = false;
    }
  }

  const state = { t: 0, curl: 0.35, spread: 1, organs: 0, nerves: 0, squeeze: 0, blink: 0, look: 0, jet: 0 };
  root.userData.state = state;

  function tick() {
    const t = state.t;
    mantleMat.color.setHex(0xffffff);
    // respiração do manto
    const br = 1 + 0.05 * Math.sin(t * 1.9);
    mantle.scale.set(br * (1 - state.squeeze * 0.42), (1 / br) * (1 + state.squeeze * 0.55), br * (1 - state.squeeze * 0.42));
    head.scale.set(1.15 * (1 - state.squeeze * 0.3), 0.86, 1.0 * (1 - state.squeeze * 0.3));

    for (const arm of arms) {
      const ph = arm.a * 0.8 + t * 1.7;
      const sp = lerp(0.55, 1.25, state.spread) * (1 - state.squeeze * 0.75);
      arm.base.rotation.z = Math.sin(ph) * 0.1;
      for (let s = 0; s < SEG; s++) {
        const k = s / SEG;
        const curl = state.curl * (0.5 + k * 1.5) + Math.sin(ph + s * 0.55) * 0.12 * (0.3 + k);
        arm.segs[s].rotation.x = curl * 0.55 - (1 - sp) * 0.5;
        arm.segs[s].rotation.z = Math.sin(ph * 0.7 + s * 0.4) * 0.09;
        arm.segs[s].scale.setScalar(s === 0 ? 1 : 1 - state.squeeze * 0.08);
      }
    }
    const bl = Math.max(state.blink, Math.pow(Math.max(0, Math.sin(t * 0.9 + 1.2)), 24));
    for (const e of eyes) {
      e.lid.rotation.x = lerp(-0.5, 0.75, bl);
      e.pup.position.x = e.sx * 0.07 + state.look * 0.08;
      e.pup.scale.y = lerp(1, 2.1, state.look);
    }
    organs.visible = state.organs > 0.01; organs.scale.setScalar(state.organs);
    const beat = Math.pow(Math.max(0, Math.sin(t * 4.2)), 3);
    hearts.forEach((h, i) => h.scale.setScalar((1 + beat * 0.35) * (i === 0 ? 1.1 : 1)));
    heartMat.emissiveIntensity = 0.7 + beat * 1.4;
    mantleMat.opacity = 1 - state.organs * 0.45; mantleMat.transparent = state.organs > 0.01;
    nerves.visible = state.nerves > 0.01;
    nerveDots.forEach((n) => {
      n.d.visible = state.nerves > 0.01;
      const w = Math.pow(Math.max(0, Math.sin(t * 5 - n.s * 0.9 - n.a * 0.4)), 4);
      n.d.scale.setScalar(state.nerves * (0.6 + w * 1.5));
    });
    nerveMat.emissiveIntensity = 1.1 + 0.9 * Math.sin(t * 6);
  }
  return { root, state, tick, arms, mantle, mantleMat, organs, nerves, eyes };
}

const hero = makeOctopus(); scene.add(hero.root);
const fem = makeOctopus({ skin: 0xb0485c, pale: 0xdf9aa4 }); fem.root.scale.setScalar(0.92); scene.add(fem.root);

// ------------------------------------------------- pedra com buraco (fuga)
const holeRock = new THREE.Group(); scene.add(holeRock);
{
  const wallMat = mat(0x6f6a62);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.95, 5, 16), wallMat);
  ring.castShadow = ring.receiveShadow = true; holeRock.add(ring);
  for (let i = 0; i < 7; i++) {
    const r = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5 + rnd() * 0.6, 0), mat(0x7a736a));
    const ang = rnd() * 6.283, rr = 1.9 + rnd() * 1.0;
    r.position.set(Math.cos(ang) * rr, Math.sin(ang) * rr, (rnd() - 0.5) * 0.7);
    r.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3); r.castShadow = true; holeRock.add(r);
  }
}

// ------------------------------------------------- bico (close)
const beak = new THREE.Group(); scene.add(beak);
{
  const bm = mat(0x241a14, { roughness: 0.4 });
  const up = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.8, 4), bm);
  up.rotation.z = Math.PI; up.rotation.y = Math.PI / 4; up.position.y = 0.3; beak.add(up);
  const lo = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.6, 4), bm);
  lo.rotation.y = Math.PI / 4; lo.position.y = -0.22; beak.add(lo);
}

// ------------------------------------------------- aquário e cano (Inky)
const tankScene = new THREE.Group(); scene.add(tankScene);
{
  const floorMat = mat(0xb9b2a6, { roughness: 0.6 });
  const fl = new THREE.Mesh(new THREE.BoxGeometry(26, 0.4, 26), floorMat);
  fl.position.y = -0.2; fl.receiveShadow = true; tankScene.add(fl);
  for (let i = -5; i <= 5; i++) {
    const ln = new THREE.Mesh(new THREE.BoxGeometry(26, 0.03, 0.05), mat(0x8e887e));
    ln.position.set(0, 0.01, i * 2.3); tankScene.add(ln);
    const ln2 = ln.clone(); ln2.rotation.y = Math.PI / 2; ln2.position.set(i * 2.3, 0.01, 0); tankScene.add(ln2);
  }
  const glass = new THREE.MeshStandardMaterial({ color: 0xbfe9f5, transparent: true, opacity: 0.22, roughness: 0.05, metalness: 0.1, side: THREE.DoubleSide });
  const tank = new THREE.Mesh(new THREE.BoxGeometry(5, 3.4, 3.4), glass);
  tank.position.set(-5.5, 1.9, 0); tankScene.add(tank);
  const frameMat = mat(0x3b3f45);
  for (const [fx, fy, fz, sx, sy, sz] of [
    [-5.5, 3.62, 0, 5.2, 0.14, 3.6], [-5.5, 0.18, 0, 5.2, 0.16, 3.6],
    [-8.05, 1.9, 0, 0.14, 3.5, 3.6], [-2.95, 1.9, 0, 0.14, 3.5, 3.6]]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), frameMat);
    b.position.set(fx, fy, fz); b.castShadow = true; tankScene.add(b);
  }
  const water = new THREE.Mesh(new THREE.BoxGeometry(4.85, 2.7, 3.45), new THREE.MeshStandardMaterial({ color: 0x2e9fc4, transparent: true, opacity: 0.4, roughness: 0.2 }));
  water.position.set(-5.5, 1.6, 0); tankScene.add(water);
  // ralo
  const drain = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.12, 20), mat(0x53504a));
  drain.position.set(5.2, 0.04, 0); tankScene.add(drain);
  const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.6, 20), mat(0x0c0f12));
  hole.position.set(5.2, -0.2, 0); tankScene.add(hole);
  for (let i = 0; i < 6; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.05, 0.07), mat(0x6b675f));
    b.position.set(5.2, 0.11, -0.4 + i * 0.16); tankScene.add(b);
  }
  // rastro de ventosas molhadas
  for (let i = 0; i < 14; i++) {
    const w = new THREE.Mesh(new THREE.CircleGeometry(0.1 + rnd() * 0.07, 10), new THREE.MeshStandardMaterial({ color: 0x7fb6c9, transparent: true, opacity: 0.5, roughness: 0.1 }));
    w.rotation.x = -Math.PI / 2; w.position.set(lerp(-3.2, 4.7, i / 13) + (rnd() - 0.5) * 0.3, 0.02, (rnd() - 0.5) * 0.7); tankScene.add(w);
  }
}

// ------------------------------------------------- toca com ovos
const den = new THREE.Group(); scene.add(den);
const eggList = [];
{
  const dm = mat(0x6a6359);
  for (let i = 0; i < 10; i++) {
    const r = new THREE.Mesh(new THREE.IcosahedronGeometry(0.8 + rnd() * 0.9, 0), dm);

// ------------------------------------------------- gota de sangue azul
const bloodMat = new THREE.MeshStandardMaterial({ color: 0x3a74ff, emissive: 0x2050dd, emissiveIntensity: 1.1, flatShading: true, transparent: true, opacity: 0.85 });
const bloodDrops = new THREE.Group(); scene.add(bloodDrops);
const dropList = [];
for (let i = 0; i < 26; i++) {
  const d = new THREE.Mesh(new THREE.IcosahedronGeometry(0.07 + rnd() * 0.09, 0), bloodMat);
  bloodDrops.add(d); dropList.push({ d, a: rnd() * 6.28, r: 0.5 + rnd() * 1.3, y: rnd(), sp: 0.5 + rnd() });
}

const phrases = TL.phrases;
const shots = []; for (const p of phrases) { if (!shots.length || shots[shots.length - 1].name !== p.shot) shots.push({ name: p.shot, start: p.start, ps: [p] }); else shots[shots.length - 1].ps.push(p); }
shots[0].start = 0; for (let i = 0; i < shots.length; i++) shots[i].end = i + 1 < shots.length ? shots[i + 1].start : TL.total;
const phraseStart = (i) => phrases[i].start;

function look(pos, tgt, fov = 40) { const d = pos.distanceTo(tgt); if (d < 6.5) pos = tgt.clone().add(pos.clone().sub(tgt).multiplyScalar(lerp(1.9, 1.15, clamp((d - 2) / 4.5, 0, 1)))); camera.position.copy(pos); camera.lookAt(tgt); camera.fov = fov; camera.updateProjectionMatrix(); }
function setWater(c, dens) { scene.background.copy(c); scene.fog.color.copy(c); scene.fog.density = dens; }
let bubbleBurst = { t0: -99, pos: V(0, 0, 0) };

function resetState(o) {
  const s = o.state;
  s.curl = 0.35; s.spread = 1; s.organs = 0; s.nerves = 0; s.squeeze = 0; s.blink = 0; s.look = 0;
}

function staging(t) {
  const sh = shots.find(s => t >= s.start && t < s.end) || shots[shots.length - 1];
  const u = t - sh.start, D = sh.end - sh.start;
  const sub = Math.floor(u / 2.3);
  hero.state.t = t; fem.state.t = t;
  resetState(hero); resetState(fem);
  hero.root.visible = true; fem.root.visible = false;
  hero.root.scale.setScalar(1);
  decor.visible = true; holeRock.visible = false; beak.visible = false;
  tankScene.visible = false; pipe.visible = false; den.visible = false; bloodDrops.visible = false;
  setWater(WATER, 0.045); sun.position.set(6, 14, 4); sun.target.position.set(0, 0, 0);
  let shake = 0;
  const swimY = 2.2 + 0.14 * Math.sin(t * 1.6);
  const N = sh.name;
  const at = (x, y, z, h = 0) => { hero.root.position.set(x, y, z); hero.root.rotation.set(0, h, 0); };

  if (N === 'face') {
    const p2 = phraseStart(1);
    at(0, swimY, 0, 0.35 + 0.1 * Math.sin(t * 0.8));
    hero.state.curl = 0.5 + 0.25 * Math.sin(t * 1.3);
    hero.state.spread = 0.8 + 0.2 * Math.sin(t * 0.9);
    if (t < p2) look(V(lerp(4.2, 3.4, u / Math.max(0.1, p2)), swimY + 0.5, 2.0), V(0.4, swimY + 0.1, 0), 42);
    else { hero.state.curl = 0.9; hero.state.spread = 0.45; look(V(2.2, swimY + 0.2, 2.6), V(0.2, swimY - 0.1, 0), 36); }
  }
  else if (N === 'reveal') {
    at(0, swimY, 0, -0.2);
    hero.state.look = sm(sh.start + 0.2, sh.start + 0.9, t);
    hero.state.curl = 0.3; hero.state.spread = 1;
    const z = lerp(5.2, 4.2, sm(sh.start, sh.end, t));
    look(V(0.4, swimY + 0.3, z), V(0, swimY, 0), 40 - 3 * sm(sh.start, sh.start + 0.6, t));
    if (u < 0.5) shake = 0.03;
  }
  else if (N === 'secret') {
    at(0, swimY, 0, 0.9);
    hero.state.curl = 0.55;
    look(V(2.6, swimY + 1.1, 3.0), V(0, swimY, 0), 38);
  }
  else if (N === 'coracoes') {
    at(0, swimY, 0, 0.1);
    hero.state.organs = sm(sh.start, sh.start + 0.8, t);
    hero.state.curl = 0.45; hero.state.spread = 0.7;
    setWater(new THREE.Color(0x124a63), 0.05);
    const z = sub % 2 === 0 ? 3.6 : 3.0;
    look(V(sub % 2 === 0 ? 0.3 : -1.4, swimY + 0.9, z), V(0, swimY + 0.5, 0), sub % 2 === 0 ? 34 : 30);
  }
  else if (N === 'sangue') {
    at(0, swimY, 0, -0.5);
    hero.state.organs = 0.75; bloodDrops.visible = true;
    bloodDrops.position.set(0, swimY + 0.3, 0);
    dropList.forEach((o, i) => {
      const a = o.a + t * o.sp * 0.9;
      o.d.position.set(Math.cos(a) * o.r, ((o.y + t * 0.18 * o.sp) % 1) * 2.4 - 1.2, Math.sin(a) * o.r);
    });
    setWater(new THREE.Color(0x0e3f5e), 0.055);
    look(V(1.6, swimY + 0.8, 3.2), V(0, swimY + 0.3, 0), 33);
  }
  else if (N === 'bracos') {
    at(0, swimY, 0, 1.6);
    hero.state.curl = 0.2 + 0.5 * sm(sh.start, sh.end, t); hero.state.spread = 1;
    look(V(0.2, swimY - 1.4, 4.0), V(0, swimY - 0.2, 0), 44);
  }
  else if (N === 'neuronios') {
    at(0, swimY, 0, 0.4 + t * 0.12);
    hero.state.nerves = sm(sh.start, sh.start + 0.7, t);
    hero.state.curl = 0.5; hero.state.spread = 0.9;
    setWater(new THREE.Color(0x0a2f45), 0.06);
    look(V(sub % 2 ? -2.2 : 2.4, swimY + 0.3, 3.4), V(0, swimY - 0.3, 0), 36);
  }
  else if (N === 'bracos2') {
    at(0, swimY, 0, 0.8);
    hero.state.nerves = 1;
    hero.state.curl = 0.75 + 0.3 * Math.sin(t * 2.4);
    setWater(new THREE.Color(0x0a2f45), 0.06);
    look(V(-1.2, swimY - 1.0, 2.9), V(-0.2, swimY - 0.8, 0), 40);
  }
  else if (N === 'mole') {
    holeRock.visible = true; holeRock.position.set(0, 2.4, 0);
    const k = sm(sh.start, sh.end, t);
    at(0, 2.4, lerp(-3.4, -1.9, k), 0);
    hero.state.curl = 0.3; hero.state.spread = 0.9;
    look(V(1.1, 3.2, 5.6), V(0, 2.4, -0.6), 44);
  }
  else if (N === 'bico') {
    holeRock.visible = true; holeRock.position.set(0, 2.4, 0);
    const k = sm(sh.start, sh.end, t);
    at(0, 2.4, lerp(-1.7, 2.2, k), 0);
    hero.state.squeeze = Math.pow(Math.sin(Math.PI * clamp(k * 1.1, 0, 1)), 0.55);
    hero.state.curl = 0.1; hero.state.spread = 0.3;
    look(V(0.9, 3.0, 5.4), V(0, 2.4, 0.2), 40);
  }
  else if (N === 'inky') {
    decor.visible = false; tankScene.visible = true;
    setWater(new THREE.Color(0x0d1a24), 0.03);
    sun.position.set(-4, 12, 6);
    at(-5.5, 2.3, 0.2, 0.5);
    hero.root.scale.setScalar(0.78);
    hero.state.curl = 0.6; hero.state.spread = 0.8;
    const kk = sm(sh.start, sh.end, t);
    look(V(lerp(-3.0, -4.2, kk), 3.0, lerp(6.2, 5.0, kk)), V(-5.4, 2.1, 0), 40);
  }
  else if (N === 'fuga') {
    decor.visible = false; tankScene.visible = true;
    setWater(new THREE.Color(0x0d1a24), 0.03);
    sun.position.set(-4, 12, 6);
    const k = sm(sh.start, sh.end, t);
    hero.root.scale.setScalar(0.72);
    const hx = lerp(-4.6, 4.2, k);
    at(hx, lerp(3.2, 0.6, sm(sh.start, sh.start + 1.1, t)), 0.3, 1.4);
    hero.state.curl = 0.95; hero.state.spread = 1.15; hero.state.squeeze = 0.25;
    look(V(hx + 0.6, 2.6, 5.6), V(hx, 1.0, 0), 44);
  }
  else if (N === 'cano') {
    const half = sh.start + D * 0.55;
    decor.visible = false;
    if (t < half) {
      tankScene.visible = true; setWater(new THREE.Color(0x0d1a24), 0.03);
      const k = sm(sh.start, half, t);
      hero.root.scale.setScalar(0.7);
      at(5.2, lerp(0.9, -0.45, k), 0, 1.4);
      hero.state.squeeze = k; hero.state.curl = 0.25; hero.state.spread = 0.18;
      look(V(6.6, 2.0, 2.9), V(5.2, 0.25, 0), 40);
    } else {
      pipe.visible = true; pipe.position.set(0, 2.0, 0);
      setWater(new THREE.Color(0x07161f), 0.045);
      const k = sm(half, sh.end, t);
      hero.root.scale.setScalar(0.7);
      at(0, 2.0, lerp(1.0, -22, k), 0);
      hero.root.rotation.x = -Math.PI / 2;
      hero.state.curl = 0.25; hero.state.spread = 0.3; hero.state.squeeze = 0.45;
      look(V(0, 2.4, lerp(3.4, -19.5, k)), V(0, 2.0, lerp(-2, -26, k)), 46);
      shake = 0.02;
    }
  }
  else if (N === 'ovos') {
    den.visible = true; den.position.set(0, 0, 0);
    hero.root.visible = false; fem.root.visible = true;
    fem.root.position.set(0, 3.1, 0.75); fem.root.rotation.set(0, 0.15, 0);
    fem.state.curl = 1.0; fem.state.spread = 0.42;
    setWater(new THREE.Color(0x0a2230), 0.06);
    sun.position.set(2, 9, 7);
    const k = sm(sh.start, sh.end, t);
    look(V(lerp(4.6, 2.0, k), lerp(4.6, 3.3, k), lerp(7.6, 5.0, k)), V(0, 2.4, 0), 40);
  }
  else if (N === 'tempo') {
    den.visible = true;
    hero.root.visible = false; fem.root.visible = true;
    fem.root.position.set(0, 3.1, 0.75); fem.root.rotation.set(0, 0.15, 0);
    fem.state.curl = 1.05; fem.state.spread = 0.42;
    // ela abana água nos ovos
    fem.state.curl += 0.18 * Math.sin(t * 2.6);
    eggList.forEach((e, i) => e.scale.setScalar(1 + 0.08 * Math.sin(t * 3 + i * 0.4)));
    setWater(new THREE.Color(0x0a2230), 0.06);
    const z = sub % 2 ? 3.2 : 4.4;
    look(V(sub % 2 ? -1.5 : 1.7, sub % 2 ? 2.6 : 3.4, z), V(0, sub % 2 ? 2.0 : 2.6, 0), sub % 2 ? 32 : 38);
  }
  else if (N === 'morte') {
    den.visible = true;
    hero.root.visible = false; fem.root.visible = true;
    const k = sm(sh.start, sh.end, t);
    fem.root.position.set(0, lerp(3.1, 2.55, k), 0.75);
    fem.state.curl = lerp(1.05, 0.2, k); fem.state.spread = lerp(0.42, 1.35, k);
    fem.state.blink = k;
    fem.root.scale.setScalar(lerp(0.92, 0.8, k));
    eggList.forEach((e, i) => e.scale.setScalar(1 + 0.5 * k * Math.sin(t * 4 + i)));
    setWater(new THREE.Color(0x09202d), 0.055 + 0.02 * k);
    look(V(1.4, 3.3, 4.4), V(0, 2.5, 0), 36);
  }
  else { // outro
    const k = sm(sh.start, sh.end, t);
    at(0, swimY, 0, 0.3 + k * 0.9);
    hero.state.curl = 0.3 + 0.35 * Math.sin(t * 1.1);
    hero.state.spread = 1.1;
    hero.state.look = sm(sh.end - 2.2, sh.end - 1.2, t);
    setWater(WATER, 0.042);
    look(V(lerp(2.0, 3.6, k), swimY + lerp(0.6, 1.8, k), lerp(4.2, 6.4, k)), V(0, swimY, 0), 42);
  }

  // câmera: tremor leve nos cortes
  if (shake > 0) { camera.position.x += (rnd() - 0.5) * shake * 6; camera.position.y += (rnd() - 0.5) * shake * 6; }
  const cut = u - sub * 2.3;
  if (cut < 0.18) { camera.fov *= 1 - 0.06 * (1 - cut / 0.18); camera.updateProjectionMatrix(); }

  hero.tick(); fem.tick();

  // ambiente vivo
  rays.forEach((r, i) => { r.m.material.opacity = 0.16 + 0.07 * Math.sin(t * 0.6 + i); r.m.rotation.z = 0.12 * Math.sin(t * 0.25 + i); });
  snow.rotation.y = t * 0.02;
  const dummy = new THREE.Object3D();
  bubbleData.forEach((b, i) => {
    const y = ((b.ph + t * 0.11 * b.sp) % 1) * 9 - 1;
    dummy.position.set(Math.cos(b.a) * (2 + b.r * 9), y, Math.sin(b.a) * (2 + b.r * 9));
    dummy.scale.setScalar(b.s); dummy.updateMatrix(); bubbles.setMatrixAt(i, dummy.matrix);
  });
  bubbles.instanceMatrix.needsUpdate = true;
  weeds.forEach((w) => { w.segs.forEach((sg, j) => { sg.rotation.z = 0.08 * Math.sin(t * 0.9 + w.ph + j * 0.5); }); });
  sun.target.updateMatrixWorld();
}

const out = document.getElementById('out'); const ctx = out.getContext('2d');
await document.fonts.load('100px Pop');
const KEY = /^(polvo|safado|oito|três|corações|azul|cobre|500|neurônios|cachorro|braços|osso|bico|inky|2016|50|53|ovos|fêmea|morre|segunda-feira)$/i;
const words = phrases.flatMap(p => p.words.map(w => ({ s: w[0], e: w[1], w: w[2] })));
function caption(t) {
  let cur = null; for (const w of words) { if (w.s <= t) cur = w; else break; }
  if (!cur || t > TL.total - 1.0) return;
  const raw = cur.w.replace(/[.,?!]+$/, ''); const txt = raw.charAt(0).toUpperCase() + raw.slice(1);
  const key = KEY.test(raw.replace(/[.,?!]/g, ''));
  const pop = 1 + 0.28 * (1 - sm(0, 0.12, t - cur.s));
  ctx.save(); ctx.translate(W / 2, 1330); ctx.scale(pop, pop); ctx.rotate(key ? -0.04 : 0);
  let fs = key ? 118 : 96; ctx.font = `${fs}px Pop`;
  const tw = ctx.measureText(txt).width; if (tw > W - 120) { fs *= (W - 120) / tw; ctx.font = `${fs}px Pop`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.lineWidth = 18; ctx.strokeStyle = '#111'; ctx.strokeText(txt, 0, 0);
  ctx.shadowColor = 'transparent'; ctx.fillStyle = key ? '#ffd43b' : '#ffffff'; ctx.fillText(txt, 0, 0);
  ctx.restore();
}

window.renderAt = (t) => {
  staging(t);
  renderer.render(scene, camera);
  ctx.drawImage(renderer.domElement, 0, 0);
  // vinheta
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,10,25,0.45)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  caption(t);
  return out.toDataURL('image/jpeg', 0.92);
};
window.TOTAL = TL.total;
window.SHOTS = shots.map(s => [s.name, s.start, s.end]);
document.title = 'ready';
</script></body></html>
